# nascTime uplink reflective QoS demo
# Authors: Afshin Zanganeh and How-Hang Liu (Technical University of Dresden)

[General]
network = nasctime.simulations.demos.uplink_qos.UplinkQosNetwork
sim-time-limit = 5s
warmup-period = 1s
simtime-resolution = fs
scheduler-class = "omnetpp::cSequentialScheduler"
result-dir = results/qos

**.routingRecorder.enabled = false
**.scalar-recording = true
*.tsnDeviceA.app[*].rcvdPkLifetime:vector.vector-recording = true
*.tsnDeviceA.app[*].rcvdPkSeqNo:vector.vector-recording = true
**.vector-recording = false

**.arp.typename = "GlobalArp"
**.binderModule = "binder"
*.configurator.assignAddresses = true
*.configurator.addStaticRoutes = true
*.configurator.addDefaultRoutes = false

# One deterministic NR cell and one UE.
*.carrierAggregation.numComponentCarriers = 1
*.carrierAggregation.componentCarrier[0].carrierFrequency = 3.5GHz
*.carrierAggregation.componentCarrier[0].numBands = 25
*.carrierAggregation.componentCarrier[0].numerologyIndex = 1
*.gnb.cellularNic.typename = "NrNicEnb"
*.gnb.cellularNic.hasSdap = true
*.ue.cellularNic.hasSdap = true
*.ue.cellularNic.sdap.reflectiveQosTableModule = "^.^.reflectiveQosTable"
*.ue.servingNodeId = 0
*.ue.nrServingNodeId = 1
*.ue.ipv4.forwarding = true

*.gnb.mobility.typename = "StationaryMobility"
*.gnb.mobility.initFromDisplayString = false
*.gnb.mobility.initialX = 750m
*.gnb.mobility.initialY = 350m
*.ue.mobility.typename = "StationaryMobility"
*.ue.mobility.initFromDisplayString = false
*.ue.mobility.initialX = 930m
*.ue.mobility.initialY = 350m

*.gnb.cellularNic.lteChannelModelType = "NrChannelModel"
*.gnb.cellularNic.channelModel[0].scenario = "INDOOR_HOTSPOT"
*.gnb.cellularNic.channelModel[0].shadowing = false
*.gnb.cellularNic.channelModel[0].fading = false
*.gnb.cellularNic.channelModel[0].dynamicLos = false
*.ue.cellularNic.lteChannelModelType = "NrChannelModel"
*.ue.cellularNic.channelModel[0].scenario = "INDOOR_HOTSPOT"
*.ue.cellularNic.channelModel[0].shadowing = false
*.ue.cellularNic.channelModel[0].fading = false
*.ue.cellularNic.channelModel[0].dynamicLos = false

# Two DRBs on the only UE (node ID 2049).
*.gnb.cellularNic.sdap.drbConfig = [ \
    {"drb": 0, "ue": 2049, "qfiList": [0], "rlcType": "UM", "trafficClass": "BACKGROUND"}, \
    {"drb": 1, "ue": 2049, "qfiList": [6], "rlcType": "UM", "trafficClass": "CONVERSATIONAL"}]
*.ue.cellularNic.sdap.drbConfig = [ \
    {"drb": 0, "qfiList": [0], "rlcType": "UM", "trafficClass": "BACKGROUND"}, \
    {"drb": 1, "qfiList": [6], "rlcType": "UM", "trafficClass": "CONVERSATIONAL"}]

# The DS-TT maps only the two experiment classes.
*.dsTt.translator.mappedPcpValues = "0,6"

# Uplink-only NW-TT settings. No node in this network generates gPTP traffic.
*.nwTt.translator.ueAddress = "ue"
*.nwTt.translator.localAddress = "nwTt"
*.nwTt.translator.tsnDeviceBAddress = ""
*.nwTt.translator.tsnDeviceBAddresses = [{address: "tsnDeviceB", ue: "ue"}]

# Direct TSN Ethernet links use matching streaming PHYs.
*.tsnDeviceA.eth[*].typename = "LayeredEthernetInterface"
*.tsnDeviceA.eth[*].phyLayer.typename = "EthernetStreamingPhyLayer"
*.tsnDeviceB.eth[*].typename = "LayeredEthernetInterface"
*.tsnDeviceB.eth[*].phyLayer.typename = "EthernetStreamingPhyLayer"
*.tsnDeviceA.eth[*].bitrate = 1Gbps
*.tsnDeviceB.eth[*].bitrate = 1Gbps
*.nwTt.ethIf.bitrate = 1Gbps
*.dsTt.tsnEth.bitrate = 1Gbps

# Perfect clocks: synchronization is outside the scope of this experiment.
*.tsnDeviceA.hasTimeSynchronization = false
*.tsnDeviceB.hasTimeSynchronization = false
*.tsnDeviceA.clock.typename = ""
*.tsnDeviceB.clock.typename = ""

# Mirror the working downlink QoS experiment in the opposite direction: a
# small periodic critical stream competes with a much heavier background
# stream.  The aggregate application load is about 17.6 Mbps and remains
# below the measured radio capacity, so queues are stressed but stable.
# Application DSCP stays zero so only PCP translation can create DSCP/QFI 6.
*.tsnDeviceB.numApps = 2
*.tsnDeviceB.app[*].typename = "UdpBasicApp"
*.tsnDeviceB.app[*].destAddresses = "tsnDeviceA"
*.tsnDeviceB.app[*].startTime = 100ms
*.tsnDeviceB.app[*].dscp = 0
*.tsnDeviceB.app[0].packetName = "high"
*.tsnDeviceB.app[0].localPort = 5000
*.tsnDeviceB.app[0].destPort = 5000
*.tsnDeviceB.app[0].messageLength = 200B
*.tsnDeviceB.app[0].sendInterval = 1ms
*.tsnDeviceB.app[1].packetName = "best-effort"
*.tsnDeviceB.app[1].localPort = 5001
*.tsnDeviceB.app[1].destPort = 5001
*.tsnDeviceB.app[1].messageLength = 1000B
*.tsnDeviceB.app[1].sendInterval = 500us

*.tsnDeviceA.numApps = 2
*.tsnDeviceA.app[*].typename = "UdpBasicApp"
*.tsnDeviceA.app[*].destAddresses = "tsnDeviceB"
*.tsnDeviceA.app[*].startTime = 10ms
*.tsnDeviceA.app[*].messageLength = 20B
*.tsnDeviceA.app[*].sendInterval = 10ms
*.tsnDeviceA.app[*].dscp = 0
*.tsnDeviceA.app[0].localPort = 5000
*.tsnDeviceA.app[0].destPort = 5000
*.tsnDeviceA.app[1].localPort = 5001
*.tsnDeviceA.app[1].destPort = 5001
*.tsnDeviceA.app[*].rcvdPkLifetime.result-recording-modes = stats,vector
*.tsnDeviceA.app[*].packetReceived.result-recording-modes = count

[Config Baseline]
description = "Single path, no PCP/QFI separation, MAXCI scheduler"
seed-set = 42
*.tsnDeviceB.hasOutgoingStreams = false
*.tsnDeviceA.hasOutgoingStreams = false
*.ue.cellularNic.sdap.useDscpAsQfiFallback = false
*.gnb.cellularNic.mac.schedulingDisciplineUl = "MAXCI"
*.gnb.cellularNic.mac.drbQosConfig = []

[Config Qos]
description = "Single path, downlink reflective QoS to uplink QFI/DRB with UE logical-channel priority"
seed-set = 42
*.ue.cellularNic.sdap.useReflectiveQos = true
*.gnb.cellularNic.sdap.useReflectiveQos = true
*.tsnDeviceB.hasOutgoingStreams = true
*.tsnDeviceA.hasOutgoingStreams = true
*.tsnDeviceA.bridging.streamIdentifier.identifier.mapping = [ \
    {packetFilter: expr(has(udp) && udp.destPort == 5000), stream: "high"}, \
    {packetFilter: expr(has(udp) && udp.destPort == 5001), stream: "best-effort"}]
*.tsnDeviceA.bridging.streamCoder.encoder.mapping = [ \
    {stream: "high", vlan: 100, pcp: 6}, \
    {stream: "best-effort", vlan: 200, pcp: 0}]
*.tsnDeviceB.bridging.streamIdentifier.identifier.mapping = [ \
    {packetFilter: expr(has(udp) && udp.destPort == 5000), stream: "high"}, \
    {packetFilter: expr(has(udp) && udp.destPort == 5001), stream: "best-effort"}]
*.tsnDeviceB.bridging.streamCoder.encoder.mapping = [ \
    {stream: "high", vlan: 100, pcp: 6}, \
    {stream: "best-effort", vlan: 200, pcp: 0}]
*.ue.cellularNic.sdap.useDscpAsQfiFallback = false
*.gnb.cellularNic.mac.drbQosConfig = []
*.gnb.cellularNic.mac.schedulingDisciplineUl = "MAXCI"
