# Authors: Afshin Zanganeh and How-Hang Liu (Technical University of Dresden)
# Scalability tests for the validated two-gNB uplink FRER path.

include frer_uplink_dualconn.ini

[Config FrerUplinkDualConnScalabilityBase]
extends = FrerUplinkDualConn_N1
description = "Common settings for uplink FRER scalability runs"

# Generate traffic only during the measurement interval, then leave two
# seconds for scheduled radio/core events to drain before scalar collection.
*.tsnDeviceB[*].app[1].stopTime = 9s
sim-time-limit = 11s

# UE coordinates are assigned directly in ExtendedMultiEndpointNetwork.ned
# using the UE vector index, independently of INI include order.

# Scalar-only recording keeps scalability runs compact while retaining all
# counters used by the analyzer.
**.vector-recording = false
**.scalar-recording = true

[Config FrerUplinkDualConn_N2]
extends = FrerUplinkDualConnScalabilityBase
description = "N=2, uplink FRER scalability over gNB+gNB2"
include profiles/profiles_N2_frer_asym.ini
include profiles/profiles_N2_gnb2_frer_asym.ini
result-dir = results/validate_frer_uplink_dualconn_n2
output-scalar-file = ${resultdir}/${configname}_run${runnumber}.sca
output-vector-file = ${resultdir}/${configname}_run${runnumber}.vec

[Config FrerUplinkDualConn_N10]
extends = FrerUplinkDualConnScalabilityBase
description = "N=10, uplink FRER scalability over gNB+gNB2"
include profiles/profiles_N10_scalability_frer_asym.ini
include profiles/profiles_N10_gnb2_frer_asym.ini
result-dir = results/validate_frer_uplink_dualconn_n10
output-scalar-file = ${resultdir}/${configname}_run${runnumber}.sca
output-vector-file = ${resultdir}/${configname}_run${runnumber}.vec
