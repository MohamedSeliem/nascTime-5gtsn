# Authors: Afshin Zanganeh and How-Hang Liu (Technical University of Dresden)
#
# frer_uplink_dualconn.ini -- uplink FRER over two independent NR legs
#
#   TSN device B
#       |
#     DS-TT  (replicate DSCP 7; replica becomes DSCP 8 / DRB 4)
#       |
#      one UE
#       |-- DRB 2 / nrMac  --> gNB  --> UPF  --> NW-TT
#       `-- DRB 4 / nrMac2 --> gNB2 --> UPF2 --> NW-TT
#                                             (recover/eliminate)
#
# The underlying FrerDualConn_N15 configuration supplies the two-gNB
# topology, deterministic secondary attachment, the second UE NR stack, and
# DRB 4 -> nrMac2 routing.  The included N1 profile makes this a one-UE run.
#

include frer_dualconn.ini

[Config FrerUplinkDualConn_N1]
extends = FrerDualConn_N15
description = "N=1, uplink FRER: DS-TT replication over gNB+gNB2, NW-TT elimination"
sim-time-limit = 10s

# This scenario isolates uplink FRER.  The inherited dual-connectivity
# configuration also defines downlink FRER parameters, but disabling these
# gates prevents the NW-TT downlink replicator and DS-TT downlink recovery
# modules from being instantiated.
*.nwTt.frerEnabled = false
*.dsTt[*].frerEnabled = false

# Uplink replication at the device-side translator.  The DRB binding changes
# the replica to DSCP 8.  UE SDAP maps DSCP/QFI 8 to DRB 4, and the existing
# dcSecondaryDrbIds="4" rule sends that DRB through nrMac2/nrPhy2 to gNB2.
*.ue[*].cellularNic.sdap.useDscpAsQfiFallback = true
*.ue[*].cellularNic.sdap2.useDscpAsQfiFallback = true
*.ue[*].cellularNic.nrDcMux.secondaryDscps = "8"
*.dsTt[*].frerUplinkEnabled = true
*.dsTt[*].frerReplicatorUl.frerStreams = "7"
*.dsTt[*].frerReplicatorUl.replicaDscp = 8
*.dsTt[*].frerReplicatorUl.transportBinding = "drb"
*.dsTt[*].frerReplicatorUl.ethernetFramed = true

# Both uplink N3 paths converge here after gNB/UPF and gNB2/UPF2.
*.nwTt.frerUplinkEnabled = true
*.nwTt.frerRecoveryUl.frerStreams = "7"
*.nwTt.frerRecoveryUl.replicaDscp = 8
*.nwTt.frerRecoveryUl.ethernetFramed = true
*.nwTt.frerRecoveryUl.windowSize = 64
*.nwTt.frerRecoveryUl.windowTimeout = 0.1s

result-dir = results/validate_frer_uplink_dualconn
output-scalar-file = ${resultdir}/${configname}_run${runnumber}.sca
output-vector-file = ${resultdir}/${configname}_run${runnumber}.vec
