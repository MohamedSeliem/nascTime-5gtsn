# Authors: Afshin Zanganeh and How-Hang Liu (Technical University of Dresden)
#
# frer_dualconn.ini — NR Dual Connectivity FRER validation
#
# Topology:
#   nwTt.pppIf  → upf  → gnb  (primary, scheduler 1)
#   nwTt.pppIf2 → upf2 → gnb2 (replica, scheduler 2)
#   UE with NR-DC: two independent NR legs (NrNicUeDC), one per gNB
#
# The secondary controller targets Binder::getSecondaryNode(primaryGnb)
# during initial association, and synchronizes nrPhy2, nrMac2, feedback and
# AMC state to that cell.  DRB 4 is therefore carried by gNB2 rather than
# merely by a second stack that remains attached to gNB.
#
# Prerequisites (updated against the final design):
#   1. NascGNodeB.ned: ppp2 gate (done)
#   2. UE uses NrNicUeDC with dualConnEnabled=true (done, replaces the
#      old NRNicUeDrbDC/dcMasterId design entirely)
#   3. IP configurator: addresses for upf2<->gnb2 subnet (done)
#   4. Binder: registerDcSecondary and deterministic initial attach (done)
#

include ../ext_multiendpoint_test/ex_multi_omnetpp.ini

[Config FrerDualConn_N15]
description = "N=15, NR-DC FRER, 10 MHz"
sim-time-limit = 10s
warmup-period = 0.5s

*.gnb.cellularNic.mac.schedulingDisciplineDl = "QOS_PF"
*.gnb.cellularNic.mac.schedulingDisciplineUl = "QOS_PF"
*.gnb2.cellularNic.mac.schedulingDisciplineDl = "QOS_PF"
*.gnb2.cellularNic.mac.schedulingDisciplineUl = "QOS_PF"

repeat = 1
seed-set = 0
**.vector-recording = true
**.scalar-recording = true

include profiles/profiles_N1_frer_asym.ini
*.carrierAggregation.componentCarrier[0].numBands = 212

# --- Enable FRER framework ---
*.nwTt.frerEnabled = true
*.dsTt[*].frerEnabled = true

# --- Enable NR-DC topology ---
# FIX: *.frerDualConn = true removed -- never confirmed to exist anywhere
# in NwTt.ned or any other module; only frerInterSession (kept below) was
# ever confirmed real. The actual UE-side DC enable flag is
# cellularNic.dualConnEnabled, set further down where the NIC is configured.
*.nwTt.frerInterSession = true
*.frerDualConn = true
*.frerInterSession =true

#*.gnb.cellularNic.processingDelayOut = 1s

# --- Configure FrerReplicator for dual connectivity ---
*.nwTt.frerReplicator.transportBinding = "dualConnectivity"
*.nwTt.frerReplicator.frerStreams = "7"
*.nwTt.frerReplicator.replicaDscp = 8
*.nwTt.frerReplicator.replicaInterface = "pppIf2"

# --- FrerRecovery (unchanged) ---
*.dsTt[*].frerRecovery.frerStreams = "7"
*.dsTt[*].frerRecovery.replicaDscp = 8

# --- UPF2: force tunnel to gnb2 ---
*.upf2.gtp_user.forceTunnelPeer = "gnb2"

# gNB2 is physically connected to UPF2 on the replica N3 leg.  The gNodeB
# default is "upf", which silently sends secondary uplink GTP-U packets
# toward the primary core instead of through its connected PPP interface.
*.gnb2.gateway = "upf2"

# --- UE: enable dual connectivity NIC ---
# FIX: "NRNicUeDrbDC" does not exist in v1.5.0 (confirmed absent months
# ago, same as gNodeBSdap/NRNicEnbDrb). Replaced with the actual final
# module built this session: NrNicUeDC, with dualConnEnabled=true (which
# also gates rrc.hasNrHandoverController2 and the whole second leg,
# per NrNicUeDC.ned).
*.ue[*].cellularNic.typename = "NrNicUeDC"
*.ue[*].cellularNic.dualConnEnabled = true

# FIX: removed -- these three lines duplicated NED defaults already set
# inside NrNicUe.ned/NrNicUeDC.ned themselves (nrPhy.feedbackGeneratorModule,
# nrDlFbGen.phyModule, nrPhy2.feedbackGeneratorModule/nrDlFbGen2.phyModule
# are all already wired in the NED files). Harmless as written, but dead
# weight; removed for clarity.
#*.ue[*].cellularNic.nrDlFbGen.phyModule = "^.nrPhy"
#*.ue[*].cellularNic.nrDlFbGen2.phyModule = "^.nrPhy2"
#*.ue[*].cellularNic.nrPhy.feedbackGeneratorModule = "^.nrDlFbGen"
#*.ue[*].cellularNic.nrPhy2.feedbackGeneratorModule = "^.nrDlFbGen2"

# FIX: *.ue[*].cellularNic.nrPhy2.dcMasterId = 2 REMOVED ENTIRELY.
# dcMasterId was a parameter on the OLD (v1.4.1-sdap-2) LtePhyUe-based
# design, read directly in that class's initialize(). It does not exist
# anywhere in the final HandoverController-based design -- attachment now
# happens exclusively through HandoverController::doHandover(), which has
# NO static ini-driven attach path for a third leg (confirmed via
# Registration.cc: it only ever registers one LTE + one NR node ID per
# UE, nothing for a genuine secondary NR leg). See OPEN GAP below for
# what actually needs to replace this line.

# --- gNB2 topology ---
# FIX: masterId was set to 2 -- gnb2's own macNodeId (also set to 2
# below), meaning gnb2 would register itself as its OWN master.
# Binder::registerMasterNode() has ASSERT(masterId != slaveId) --
# confirmed this crashes on a failed assertion at simulation start, not a
# silent misconfiguration. masterId must be gnb's actual MacNodeId.
# VERIFY: gnb's macNodeId isn't set anywhere in this file or (as far as
# reviewed) ex_multi_omnetpp.ini, so it comes from NrNicEnb's NED default
# (simu5g_seq()-based, starting at ENB_MIN_ID). It is very likely 1 as
# the first/only other gNB declared, but this has NOT been confirmed
# against the actual running topology -- check *.gnb.macNodeId's real
# resolved value (e.g. via a quick Qtenv inspection) before trusting the
# value below.
*.gnb2.macNodeId = 2
*.gnb2.macCellId = 2
*.gnb2.masterId = 1   # gnb's macNodeId -- VERIFY, see note above

# Keep radio coordinates independent from Qtenv layout. Both cells must stay
# within the 150 m validity range of the INDOOR_HOTSPOT channel model.
*.gnb2.mobility.initialX = 520m
*.gnb2.mobility.initialY = 250m
*.gnb2.mobility.initialZ = 0m
*.gnb2.mobility.initFromDisplayString = false
*.gnb2.mobility.updateFromDisplayString = false
*.gnb2.mobility.updateDisplayString = false

*.ue[*].cellularNic.sdap2.nodeRole = "UE"

*.ue[*].cellularNic.rrc.nrHandoverController2.dynamicCellAssociation = true
*.ue[*].cellularNic.rrc.nrHandoverController2.enableHandover = true
*.ue[*].cellularNic.sdap2.drbConfig = [ \
    {drb: 0, qfiList: [0]}, \
    {drb: 1, qfiList: [6]}, \
    {drb: 2, qfiList: [7]}, \
    {drb: 3, qfiList: [5]}, \
    {drb: 4, qfiList: [8]}]

