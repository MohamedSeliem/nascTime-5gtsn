# Authors: Afshin Zanganeh and How-Hang Liu (Technical University of Dresden)
#
# ex_multi_omnetpp.ini — base configuration for heterogeneous traffic scenarios.
#
# This file contains everything that is INDEPENDENT of N and the profile mix.
# Per-endpoint app generators, sinks, BMCA spanning tree, NW-TT registration,
# and SDAP drbConfig are produced by gen_profile_ini.py and included via the
# scenario-specific Config sections below.
#
# Generate the profile fragments first:
#   python3 gen_profile_ini.py --all -o profiles/
#
# Then run the desired scenario:
#   opp_run -u Cmdenv -c Hetero_N5 -f ex_multi_omnetpp.ini ...
#

[General]
network = nasctime.simulations.demos.ext_multiendpoint_test.ExtendedMultiEndpointNetwork
sim-time-limit = 10s
warmup-period = 1s
simtime-resolution = fs

scheduler-class = "omnetpp::cSequentialScheduler"

*.cmdenv-log-level = info
cmdenv-express-mode = true
cmdenv-status-frequency = 2s

result-dir = results/hetero
**.routingRecorder.enabled = false
**.vector-recording = true
**.scalar-recording = true
# **.receivedPacketFromLowerLayer.result-recording-modes = -
# **.packetReceived.result-recording-modes = -

# ============================================================================
# IP / ARP
# ============================================================================
*.configurator.assignAddresses = true
*.configurator.addStaticRoutes = true
*.configurator.addDefaultRoutes = false
**.arp.typename = "GlobalArp"
**.binderModule = "binder"

# ============================================================================
# 5G RAN
# ============================================================================
*.carrierAggregation.numComponentCarriers = 1
*.carrierAggregation.componentCarrier[0].carrierFrequency = 3.5GHz
*.carrierAggregation.componentCarrier[0].numBands = 106 # at μ=1 are 10 MHz (24 RBs), 20 MHz (51 RBs), 40 MHz (106 RBs)
*.carrierAggregation.componentCarrier[0].numerologyIndex = 1

*.gnb.cellularNic.typename = "NrNicEnb"

# NOTE: channelModel[0] is a direct submodule of cellularNic (confirmed:
# LteNicBase.ned instantiates channelModel[numCarriers] as a sibling of phy,
# not nested inside it), so this path is correct as written — unlike the
# basic multi-endpoint ini, which used "phy.channelModel[0]..." and likely
# had these settings silently ignored (unmatched ini params don't error by
# default). Worth fixing that file too if channel model fidelity matters there.
*.gnb.cellularNic.channelModel[0].typename = "NrChannelModel_3GPP38_901"
*.gnb.cellularNic.channelModel[0].scenario = "INDOOR_HOTSPOT"
*.gnb.cellularNic.channelModel[0].shadowing = false
*.gnb.cellularNic.channelModel[0].fading = false
*.gnb.cellularNic.channelModel[0].dynamicLos = false

*.gnb.cellularNic.channelModel[0].nodebHeight = 10m
*.gnb.cellularNic.channelModel[0].ueHeight = 1.5m
*.gnb.cellularNic.channelModel[0].antennGainEnB = 8dBi
*.gnb.cellularNic.channelModel[0].antennaGainUe = 0dBi

*.gnb.mobility.initialX = 500m
*.gnb.mobility.initialY = 250m
*.gnb.mobility.initialZ = 0m
*.gnb.mobility.initFromDisplayString = false
*.gnb.mobility.updateFromDisplayString = false
*.gnb.mobility.updateDisplayString = false

# FIX: SDAP submodule requires hasSdap = true on the NIC, or your gen_profile_ini.py
# drbConfig assignments (in the profile includes below) are configuring a
# submodule that was never instantiated. If gen_profile_ini.py's generated
# fragments already set this, remove the duplicate below — but confirm they do
# rather than assume it, since that script predates the hasSdap requirement.
*.gnb.cellularNic.hasSdap = true
*.ue[*].cellularNic.hasSdap = true

# REMOVED: nrPdcp[*]/nrRlc[*].um.multiSession do not exist anywhere in v1.5.0
# (confirmed via grep, zero matches). PDCP/RLC are per-bearer dynamic entities
# now — "multi-session for multi-UE DRB operation" is presumably implicit from
# however many DRBs your generated drbConfig lists per UE; there's no separate
# flag here to set. If your profile generator produces per-UE drbConfig blocks
# already, this concept is likely already handled there.

# Default scheduler — overridden per-config
*.gnb.cellularNic.mac.schedulingDisciplineDl = "QOS_PF"
*.gnb.cellularNic.mac.schedulingDisciplineUl = "QOS_PF"

# ============================================================================
# UEs
# ============================================================================
# FIX: masterId/nrMasterId renamed to servingNodeId/nrServingNodeId (confirmed
# via diff, same rename as the basic ini). nrMacCellId was removed outright,
# not renamed — deleted, no replacement exists.
*.ue[*].servingNodeId = 0
*.ue[*].nrServingNodeId = 1
*.ue[*].ipv4.forwarding = true

# UE positions are assigned from the vector index in
# ExtendedMultiEndpointNetwork.ned. Keeping the assignment in NED guarantees
# finite X/Y/Z values before StationaryMobility initializes.
*.ue[*].mobility.typename = "StationaryMobility"

# ============================================================================
# NW-TT (multi-endpoint registration comes from the include)
# ============================================================================
*.nwTt.translator.ueAddress = "ue[0]"
*.nwTt.translator.localAddress = "nwTt"
*.nwTt.translator.tsnDeviceBAddress = ""
*.nwTt.translator.gptpTransportMode = "gtpu"
*.nwTt.translator.gptpEncapUdpPort = 30001
*.nwTt.ethIf.bitrate = 1Gbps

# ============================================================================
# DS-TTs
# ============================================================================
*.dsTt[*].translator.gptpEncapUdpPort = 30001

# ============================================================================
# Ethernet
# ============================================================================
*.tsnDeviceA.eth[*].typename = "LayeredEthernetInterface"
*.tsnDeviceA.eth[*].phyLayer.typename = "EthernetStreamingPhyLayer"
*.tsnSwitch.eth[*].typename = "LayeredEthernetInterface"
*.tsnSwitch.eth[*].phyLayer.typename = "EthernetStreamingPhyLayer"
*.tsnDeviceB[*].eth[*].typename = "LayeredEthernetInterface"
*.tsnDeviceB[*].eth[*].phyLayer.typename = "EthernetStreamingPhyLayer"

*.tsnDevice*.eth[*].bitrate = 1Gbps
*.tsnSwitch.eth[*].bitrate = 1Gbps

# ============================================================================
# gPTP
# ============================================================================
*.tsnDeviceA.hasTimeSynchronization = true
*.tsnDeviceA.gptp.gptpNodeType = "MASTER_NODE"
*.tsnDeviceA.gptp.masterPorts = ["eth0"]
*.tsnDeviceA.gptp.slavePort = ""
*.tsnDeviceA.clock.typename = "OscillatorBasedClock"
*.tsnDeviceA.clock.oscillator.nominalTickLength = 10ns

*.tsnSwitch.hasTimeSynchronization = true
*.tsnSwitch.gptp.gptpNodeType = "BRIDGE_NODE"
*.tsnSwitch.gptp.masterPorts = ["eth1"]
*.tsnSwitch.gptp.slavePort = "eth0"
*.tsnSwitch.clock.oscillator.nominalTickLength = 10ns

*.tsnDeviceB[*].hasTimeSynchronization = true
*.tsnDeviceB[*].gptp.gptpNodeType = "SLAVE_NODE"
*.tsnDeviceB[*].gptp.slavePort = "eth0"
*.tsnDeviceB[*].gptp.masterPorts = []
*.tsnDeviceB[*].gptp.pdelayInterval = 1000s
*.tsnDeviceB[*].gptp.pdelayInitialOffset = 1000s
*.tsnDeviceB[*].clock.typename = "SettableClock"
*.tsnDeviceB[*].clock.oscillator.nominalTickLength = 10ns

# ============================================================================
# TSN AF
# ============================================================================
*.tsnAf.portSpeedBps = 1Gbps
*.tsnAf.numTrafficClasses = 8
*.tsnAf.nwTtModule = "nwTt"
*.tsnAf.dsTtModule = "dsTt[0]"
*.tsnAf.gnbModule = "gnb"

# ============================================================================
# Static BMCA grandmaster (spanning tree comes from the include)
# ============================================================================
*.staticBmca.grandmasterModule = "tsnDeviceA"
*.staticBmca.transparentClockEnabled = true
*.staticBmca.correctionFieldSupport = true

# ============================================================================
# Heterogeneous scenarios — one Config per N value
# ============================================================================

[Config Hetero_N1]
description = "1 endpoint, single CLC profile"
include profiles/profiles_N1.ini

[Config Hetero_N5]
description = "5 endpoints, mixed CLC/MV/BLK"
include profiles/profiles_N5.ini

[Config Hetero_N10]
description = "10 endpoints, mixed CLC/MV/BLK"
include profiles/profiles_N10.ini

[Config Hetero_N15]
description = "15 endpoints, mixed CLC/MV/BLK"
include profiles/profiles_N15.ini

[Config Hetero_N20]
description = "20 endpoints, mixed CLC/MV/BLK"
include profiles/profiles_N20.ini
