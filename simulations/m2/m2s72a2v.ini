# M2-S7.2a A2-D2: PROPOSED configuration for the single real-NACK validation run A2-V1 (design review
# results/M2-S7.2a-a2d2-design-review.md). FOR REVIEW ONLY: no run is authorised by this file.
# Hand-written, not generated. m2s72s5.ini and m2s72.ini are included unchanged; this file adds sections only.
#
# Mechanism (Simu5G 1.8.1, unmodified): the upstream IdealChannelModel (stack/phy/channelmodel/IdealChannelModel.*),
# the channel Simu5G itself uses to exercise H-ARQ / RLC at a known loss rate (simulations/nr/rlc/omnetpp.ini,
# [Config Base]). A DL transport block of ue[1] fails decoding with probability perDl * harqReduction^(n-1) on its
# n-th transmission attempt (IdealChannelModel::isReceptionSuccessful); the UE's H-ARQ RX answers NACK
# (LteHarqProcessRx.cc:60 / LteHarqBufferRx::sendFeedback) and the gNB retransmits the same MAC PDU
# (LteHarqUnitTx::pduFeedback "set for RTX"), at most maxHarqRtx = 3 times (LteMacBase.ned default, unchanged).
# The reported SINR is pinned (FAKE_SINR_DB), so CQI = 15 on every band for both UEs and both directions.
# ue[0] (the loaded UE) and the whole uplink are loss-free (perDl / perUl = 0).

include m2s72s5.ini

[Config M2S72A2V-ideal-nack-ue1]
description = "(mixin, A2-D2 proposal) IdealChannelModel at gNB and UEs; DL decoding error 0.1 per attempt on ue[1] only, independent attempts; ue[0] DL and all UL loss-free; loss process on its own RNG 4"
*.gnb1.cellularNic.channelModelType = "IdealChannelModel"
*.ue[*].cellularNic.nrChannelModelType = "IdealChannelModel"
*.ue[1].cellularNic.nrChannelModel[*].perDl = 0.1
*.ue[1].cellularNic.nrChannelModel[*].harqReduction = 1
**.perDl = 0
**.perUl = 0
**.perD2D = 0
num-rngs = 5
seed-4-mt = 400${repetition}
**.channelModel[*].rng-0 = 4
**.nrChannelModel[*].rng-0 = 4

[Config M2S72-E0vN-q0-one0-n2-f1_A2V1]
description = "A2-V1 (A2-D2 proposal, not authorised): M2S72-E0vN-q0-one0-n2-f1 unchanged + M2S72A2V-ideal-nack-ue1; single run, seed 0"
extends = M2S72A2V-ideal-nack-ue1, M2S72-E0vN-q0-one0-n2-f1
