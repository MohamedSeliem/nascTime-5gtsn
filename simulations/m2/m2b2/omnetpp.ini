# M2B-2 TEST configurations of the S-CLK adapter TtGateClock (docs/migration/m2b-2-clock-and-observation.md).
# Development tests on a 5-module test network; not accepted experiment configurations, not scientific results.
[General]
network = nasctime.simulations.m2.m2b2.TtGateClockTest
simtime-resolution = ps
sim-time-limit = 30.0005ms
**.gate.durations = [1ms, 1ms]
**.gate.initiallyOpen = true
**.source.packetLength = 64B
**.source.productionInterval = 1s
**.gate.gateState:vector.vector-recording = true
**.vector-recording = false
**.scalar-recording = true
output-vector-precision = 17

[Config TG-ideal]
description = "TtClock at its defaults (C_T(s) = s): gate changes on the simulation-time grid"

[Config TG-offset]
description = "constant 5G time-reference error theta0 = +250 us"
**.ttClock.theta0 = 250us

[Config TG-rate]
description = "TT oscillator frequency error y = +100 ppm, free-running"
**.ttClock.freqOffsetPpb = 100000

[Config TG-drift]
description = "frequency error y = -50 ppm and drift D = 1e6 ppb/s, 5G time updates every 10 ms"
**.ttClock.freqOffsetPpb = -50000
**.ttClock.driftPpbPerS = 1000000
**.ttClock.updateInterval = 10ms

[Config TG-step-back]
description = "y = +200 ppm, updates every 5 ms (offset 0.5 us): C_T steps back by ~1 us at each update (a change just before a step is not repeated)"
**.ttClock.freqOffsetPpb = 200000
**.ttClock.updateInterval = 5ms
**.ttClock.updateOffset = 0.5us

[Config TG-step-fwd]
description = "y = -200 ppm, updates every 5 ms (offset 999.5 us): each forward step of ~1 us crosses a gate change (overdue)"
**.ttClock.freqOffsetPpb = -200000
**.ttClock.updateInterval = 5ms
**.ttClock.updateOffset = 999.5us

[Config TG-step-fwd-relative]
description = "as TG-step-fwd with relative gate scheduling (scheduleForAbsoluteTime = false)"
extends = TG-step-fwd
**.gate.scheduleForAbsoluteTime = false

[Config TG-rate-relative]
description = "as TG-rate with relative gate scheduling (reference for TG-step-fwd-relative's spacing)"
**.ttClock.freqOffsetPpb = -200000
**.gate.scheduleForAbsoluteTime = false

# ---- negative controls (each must stop with the stated error) ----
[Config TGN-no-ttclock]
description = "NEGATIVE: ttClockModule does not name a TtClock"
**.clock.ttClockModule = "^.sink"

[Config TGN-range]
description = "NEGATIVE: |freqOffsetPpb| > 1e6"
**.ttClock.freqOffsetPpb = 2000000

[Config TGN-overdue-error]
description = "NEGATIVE: forward step with overdueClockEventHandlingMode = error"
extends = TG-step-fwd
**.clock.overdueClockEventHandlingMode = "error"

[Config TGN-resolution]
description = "NEGATIVE: run with --simtime-resolution=us (a [General]-only option, given on the command line by the test)"
