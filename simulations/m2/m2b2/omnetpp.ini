# M2B-2 TEST configurations of the S-CLK adapter TtGateClock (docs/migration/m2b-2-clock-and-observation.md).
# Development tests on a 5-module test network; not accepted experiment configurations, not scientific results.
[General]
network = nasctime.simulations.m2.m2b2.TtGateClockTest
simtime-resolution = ps
sim-time-limit = 30.0005ms
**.gate.durations = [1ms, 1ms]
**.gate.initiallyOpen = true
**.source.packetLength = 64B
**.source.productionInterval = 1s
**.gate.gateState:vector.vector-recording = true
**.vector-recording = false
**.scalar-recording = true
output-vector-precision = 17

[Config TG-ideal]
description = "TtClock at its defaults (C_T(s) = s): gate changes on the simulation-time grid"

[Config TG-offset]
description = "constant 5G time-reference error theta0 = +250 us"
**.ttClock.theta0 = 250us

[Config TG-rate]
description = "TT oscillator frequency error y = +100 ppm, free-running"
**.ttClock.freqOffsetPpb = 100000

[Config TG-drift]
description = "frequency error y = -50 ppm and drift D = 1e6 ppb/s, 5G time updates every 10 ms"
**.ttClock.freqOffsetPpb = -50000
**.ttClock.driftPpbPerS = 1000000
**.ttClock.updateInterval = 10ms

[Config TG-step-back]
description = "y = +200 ppm, updates every 5 ms (offset 0.5 us): C_T steps back by ~1 us at each update (a change just before a step is not repeated)"
**.ttClock.freqOffsetPpb = 200000
**.ttClock.updateInterval = 5ms
**.ttClock.updateOffset = 0.5us

[Config TG-step-fwd]
description = "y = -200 ppm, updates every 5 ms (offset 999.5 us): each forward step of ~1 us crosses a gate change (overdue)"
**.ttClock.freqOffsetPpb = -200000
**.ttClock.updateInterval = 5ms
**.ttClock.updateOffset = 999.5us

[Config TG-step-fwd-relative]
description = "as TG-step-fwd with relative gate scheduling (scheduleForAbsoluteTime = false)"
extends = TG-step-fwd
**.gate.scheduleForAbsoluteTime = false

[Config TG-rate-relative]
description = "as TG-rate with relative gate scheduling (reference for TG-step-fwd-relative's spacing)"
**.ttClock.freqOffsetPpb = -200000
**.gate.scheduleForAbsoluteTime = false

# ---- negative controls (each must stop with the stated error) ----
[Config TGN-no-ttclock]
description = "NEGATIVE: ttClockModule does not name a TtClock"
**.clock.ttClockModule = "^.sink"

[Config TGN-range]
description = "NEGATIVE: |freqOffsetPpb| > 1e6"
**.ttClock.freqOffsetPpb = 2000000

[Config TGN-overdue-error]
description = "NEGATIVE: forward step with overdueClockEventHandlingMode = error"
extends = TG-step-fwd
**.clock.overdueClockEventHandlingMode = "error"

[Config TGN-resolution]
description = "NEGATIVE: run with --simtime-resolution=us (a [General]-only option, given on the command line by the test)"

# ---- step 148 (C2 / C3): probe configurations on TtGateClockProbeTest (IClock queries at chosen instants) ----
[Config P-rate-pos]
description = "y = +1e6 ppb (rate > 1: C skips picoseconds); range ends of both mappings"
network = nasctime.simulations.m2.m2b2.TtGateClockProbeTest
**.ttClock.freqOffsetPpb = 1000000
**.probe.times = "0 1000000000"
**.probe.targets = "min now-1 now+0 now+1 now+2 now+1000 now+4611686018427387904 max"
**.probe.simTimes = "now+0 now+1 now+1000 smax"

[Config P-rate-neg]
description = "y = -1e6 ppb (rate < 1); the largest clock time is not reached within the simtime_t range"
network = nasctime.simulations.m2.m2b2.TtGateClockProbeTest
**.ttClock.freqOffsetPpb = -1000000
**.probe.times = "0 1000000000"
**.probe.targets = "min now-1 now+0 now+1 now+1000 now+4611686018427387904 max"
**.probe.simTimes = "now+0 now+1 now+1000 smax"

[Config P-drift-neg]
description = "D = -1e6 ppb/s without time updates: C_T is non-decreasing only up to 1000 s (C = 500 s there)"
network = nasctime.simulations.m2.m2b2.TtGateClockProbeTest
sim-time-limit = 2s
**.ttClock.driftPpbPerS = -1000000
**.probe.times = "0 1000000000000"
**.probe.targets = "now+0 now+1 now+400000000000000 now+600000000000000 max"
**.probe.simTimes = "now+0 now+998000000000000 now+999000000000000 now+1000000000000000 smax"

[Config P-step-fwd]
description = "as TG-step-fwd: queries just before, at and just after the forward step at 5.9995 ms"
network = nasctime.simulations.m2.m2b2.TtGateClockProbeTest
**.ttClock.freqOffsetPpb = -200000
**.ttClock.updateInterval = 5ms
**.ttClock.updateOffset = 999.5us
**.probe.times = "5999499999 5999500000 5999500001"
**.probe.targets = "now-1000 now-1 now+0 now+1 now+2 now+999 now+1000 now+1001 now+2000000"
**.probe.simTimes = "now+0 now+1 now+2 now+1000000"

[Config P-step-back]
description = "as TG-step-back: queries just before, at and just after the backward step at 5.0005 ms"
network = nasctime.simulations.m2.m2b2.TtGateClockProbeTest
**.ttClock.freqOffsetPpb = 200000
**.ttClock.updateInterval = 5ms
**.ttClock.updateOffset = 0.5us
**.probe.times = "5000499999 5000500000 5000500001"
**.probe.targets = "now-1000 now-1 now+0 now+1 now+2 now+999 now+1000 now+1001 now+2000000"
**.probe.simTimes = "now+0 now+1 now+2 now+1000000"

[Config P-skip]
description = "y = +1e6 ppb: clock events at a skipped clock picosecond, scheduled in reverse clock order (C2)"
network = nasctime.simulations.m2.m2b2.TtGateClockProbeTest
sim-time-limit = 1ms
**.ttClock.freqOffsetPpb = 1000000
**.probe.times = "1000"
**.probe.skipEvents = true

[Config PN-interval]
description = "NEGATIVE: D = -1e6 ppb/s with updates every 2000 s (longer than the 1000 s monotone range)"
network = nasctime.simulations.m2.m2b2.TtGateClockProbeTest
**.ttClock.driftPpbPerS = -1000000
**.ttClock.updateInterval = 2000s
**.probe.times = "0"

# ---- step 149 (C3-R1): arithmetic boundaries of C_u far from the segment start (no / sparse updates) ----
[Config P-arith-pos-max]
description = "D = +1e6 ppb/s (maximum), no updates: distant times / targets where D*d^2 exceeds the int128 range"
network = nasctime.simulations.m2.m2b2.TtGateClockProbeTest
sim-time-limit = 2s
**.ttClock.driftPpbPerS = 1000000
**.probe.times = "0 1000000000000"
**.probe.targets = "now+0 now+1 now+1000000000000 now+100000000000000000 now+1000000000000000000 max"
**.probe.simTimes = "now+1000000000000 now+12000000000000000 now+100000000000000000 now+130000000000000000 smax"

[Config P-arith-pos-min]
description = "D = +1 ppb/s (smallest positive), no updates: the whole simtime range"
network = nasctime.simulations.m2.m2b2.TtGateClockProbeTest
**.ttClock.driftPpbPerS = 1
**.probe.times = "0"
**.probe.targets = "now+4611686018427387904 now+9000000000000000000 max"
**.probe.simTimes = "now+9000000000000000000 smax"

[Config P-arith-pos-3]
description = "D = +3, y = -1e6: C fits int64 at 9e18 ps although D*d^2 exceeds the int128 range"
network = nasctime.simulations.m2.m2b2.TtGateClockProbeTest
**.ttClock.driftPpbPerS = 3
**.ttClock.freqOffsetPpb = -1000000
**.probe.times = "0"
**.probe.targets = "now+9000000000000000000 max"
**.probe.simTimes = "now+9000000000000000000 now+9100000000000000000 smax"

[Config P-arith-pos-upd]
description = "D = +1e6, y = +1e6, updates every 10 ms: the extended segment far beyond the next update"
network = nasctime.simulations.m2.m2b2.TtGateClockProbeTest
**.ttClock.driftPpbPerS = 1000000
**.ttClock.freqOffsetPpb = 1000000
**.ttClock.updateInterval = 10ms
**.ttClock.updateOffset = 1ms
**.probe.times = "0 15000000000"
**.probe.targets = "now+1 now+1000000000000000000 max"
**.probe.simTimes = "now+1 now+100000000000000000 smax"

[Config P-arith-neg-max]
description = "D = -1e6 (maximum negative), y = +1e6, updates every 500 s (within the 1000 s monotone span): distant queries"
network = nasctime.simulations.m2.m2b2.TtGateClockProbeTest
**.ttClock.driftPpbPerS = -1000000
**.ttClock.freqOffsetPpb = 1000000
**.ttClock.updateInterval = 500s
**.probe.times = "0 1000000000"
**.probe.targets = "now+1 now+400000000000000 now+600000000000000 max"
**.probe.simTimes = "now+1 now+1001000000000000 now+1001000000000001 smax"
