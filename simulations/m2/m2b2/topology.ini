# M2B-2 step 148 (C4): TEST-ONLY binding queries of the S-CLK adapter in the real M2 TT topology (M2S72Bridge).
# Each config extends an ACCEPTED S7.2a configuration (m2s72.ini, included unchanged) and only adds the clock slot,
# optionally the translators' egress shaping, parameter recording, and sim-time-limit = 1ps: the network is set up
# and initialized (all stages, incl. the adapter's cross-check against the TtClock); only events at t <= 1 ps run.
# Not an experiment configuration; no traffic, no TAS schedule, no result beyond the binding.
# Used by simulations/m2/check/test_m2b2_topology.py.
include ../m2s72.ini

[Config C4-clock]
description = "TEST: M2S72-B-q0-Eall-n2 + TtGateClock in every translator's clock slot (egress shaping off)"
extends = M2S72-B-q0-Eall-n2
sim-time-limit = 1ps
*.nwTt.clock.typename = "nasctime.m2.TtGateClock"
*.dsTt[*].clock.typename = "nasctime.m2.TtGateClock"
**.param-recording = true

[Config C4-tas-unbound]
description = "TEST: as C4-clock, with the translators' egress shaping on (INET Ieee8021qTimeAwareShaper, default gates); no explicit gate binding"
extends = C4-clock
*.nwTt.hasEgressTrafficShaping = true
*.dsTt[*].hasEgressTrafficShaping = true

[Config C4-tas]
description = "TEST: as C4-tas-unbound, with the gates bound explicitly to the translator's clock (as INET's TSN showcases do)"
extends = C4-tas-unbound
# EthernetSwitch's *.clockModule default reaches only direct submodules; the shaper's gates are 4 levels down
*.nwTt.eth[*].macLayer.queue.transmissionGate[*].clockModule = "^.^.^.^.clock"
*.dsTt[*].eth[*].macLayer.queue.transmissionGate[*].clockModule = "^.^.^.^.clock"

[Config C4N-no-ttclock]
description = "NEGATIVE: TtGateClock in an accepted configuration without TT clocks (M2S72-B-q0-Ca-n2): must stop"
extends = M2S72-B-q0-Ca-n2
sim-time-limit = 1ps
*.dsTt[*].clock.typename = "nasctime.m2.TtGateClock"
