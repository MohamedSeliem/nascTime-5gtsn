extends = M2S4U-fault-base
*.ttB.eth[1].measurementLayer.injector.action = "delay"
*.ttB.eth[1].measurementLayer.injector.messageTypes = "3 10"
*.ttB.eth[1].measurementLayer.injector.sequenceIds = "9"
*.ttB.eth[1].measurementLayer.injector.delay = 150ms

[Config M2S4U-F7]
description = "F7: Resp seq 10 with sequenceId 999"
extends = M2S4U-fault-base
*.ttB.eth[1].measurementLayer.injector.action = "rewrite"
