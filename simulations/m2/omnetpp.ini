*.ttB.eth[1].measurementLayer.injector.sequenceIds = "22"

[Config M2S4U-nc-previousSeq]
description = "N2b: ttA responder answers with the previous request's sequenceId"
extends = M2S4U
*.ttA.eth[1].trafficConditionerLayer.engine.pairingTest = "previousSeq"

# R2 attribution control (not a translator config): M2S1 with the slave's Pdelay switched
# off (no Pdelay frame anywhere) and no TtPdelayPort. The 5GS then carries the same gPTP
# traffic as in M2S4 (Sync/Follow_Up only), so application latencies are expected to match
# M2S4 except where an engine frame on a TT's TSN link delays an application frame.
[Config M2S4-ctl-nopdelay]
description = "R2 attribution control: M2S1 without any Pdelay (slave pdelay timer beyond the end of the run)"
extends = M2S1
*.talker.gptp.pdelayInitialOffset = 10s

[Config M2S4-ctl-nopdelay-load]
description = "R2 attribution control under saturating load"
extends = M2S4-ctl-nopdelay, M2S0-load-traffic
#------------------------------------#
# M2-S5: online downlink two-step gPTP correction (migration/m2-s5-design.md, rev. 2.1).
# nasctime.m2.TtPtpPort replaces TtPdelayPort in the trafficConditionerLayer slot of each
# translator's eth[1]; it contains the M2-S4 Pdelay engine unchanged (same names and
# parameters, so every M2S4 setting applies). M2-S4 is the timing baseline: every M2S5
# config extends the matching M2S4 config. All M1/M2-S0/M2-S1/M2-S4 configs above are
# unchanged.
#
# M2S5-passive*: hard gate G0. TtPtpPort installed with the correction off; every PCAP,
# per-frame log, engine log, vector and scalar of the matching M2S4 run must be reproduced.
[Config M2S5-passive]
description = "M2-S5 gate G0: M2S4 with TtPtpPort (correction off) on both translators' eth[1]"
extends = M2S4
*.*Tt.eth[1].trafficConditionerLayer.typename = "nasctime.m2.TtPtpPort"

[Config M2S5-passive-frag]
description = "M2-S5 gate G0, N3 fragmentation"
extends = M2S5-passive, M2S0-frag-n3

[Config M2S5-passive-load]
description = "M2-S5 gate G0, saturating load"
extends = M2S5-passive, M2S0-load-traffic

[Config M2S5-passive-load-harq16]
description = "M2-S5 gate G0, saturating load, 16 HARQ processes"
extends = M2S5-passive, M2S0-load-traffic, M2S0-harq16

#------------------------------------#
# M2-S5 unit topology (design 7.4): gm -- ttN -- 1 us cable -- ttD -- 100 Mb/s -- slave.
# DL background (1500 B every 173 us, gm -> slave) makes Syncs queue at ttD.eth[1] while
# their Follow_Ups arrive (FIFO hold, active configs only).
# M2S5U-base: the same network with the M2-S4 port (no correction, no hold possible): the
# reference for gate G0 (unit) and for the FIFO-replay validation (H0).
[Config M2S5U-base]
description = "M2-S5 unit, M2-S4 behaviour: TtPdelayPort, Pdelay terminated, no correction"
network = nasctime.simulations.m2.M2S5ChainTest
sim-time-limit = 3s
**.fcsMode = "computed"
**.checksumMode = "computed"
*.gm.typename = "TsnDevice"
*.slave.typename = "TsnDevice"
*.gm.hasIpv4 = false
*.slave.hasIpv4 = false
*.gm.eth[*].typename = "LayeredEthernetInterface"
*.slave.eth[*].typename = "LayeredEthernetInterface"
*.gm.ethernet.typename = "EthernetLayer"
*.slave.ethernet.typename = "EthernetLayer"
*.gm.ieee8021q.typename = "Ieee8021qProtocol"
*.slave.ieee8021q.typename = "Ieee8021qProtocol"
*.gm.ethernet.hasSocketSupport = true
*.slave.ethernet.hasSocketSupport = true
*.gm.llc.typename = ""
*.slave.llc.typename = ""
*.gm.hasTimeSynchronization = true
*.slave.hasTimeSynchronization = true
*.gm.gptp.gptpNodeType = "MASTER_NODE"
*.gm.gptp.slavePort = ""
*.gm.gptp.masterPorts = ["eth0"]
*.slave.gptp.gptpNodeType = "SLAVE_NODE"
*.slave.gptp.slavePort = "eth0"
*.gm.clock.oscillator.typename = "IdealOscillator"
*.slave.clock.oscillator.typename = "IdealOscillator"
*.slave.clock.emitClockTimeInterval = 1ms
*.slave.clock.referenceClock = "gm.clock"
*.gm.eth[*].phyLayer.transmitter.typename = "StreamingTransmitter"
*.gm.eth[*].phyLayer.receiver.typename = "DestreamingReceiver"
*.slave.eth[*].phyLayer.transmitter.typename = "StreamingTransmitter"
*.slave.eth[*].phyLayer.receiver.typename = "DestreamingReceiver"
*.tt*.eth[1].phyLayer.transmitter.typename = "StreamingTransmitter"
*.tt*.eth[1].phyLayer.receiver.typename = "DestreamingReceiver"
*.ttD.eth[1].bitrate = 100Mbps
*.slave.eth[0].bitrate = 100Mbps
# DL background: 1500 B every 173 us from gm to slave (untagged; 173 us does not divide the
# 125 ms Sync interval, so the phase of a Sync relative to the background varies), sink at the slave
*.gm.numApps = 1
*.gm.app[0].typename = "EthernetSourceApp"
*.gm.app[0].source.packetLength = 1500B
*.gm.app[0].source.productionInterval = 173us
*.gm.app[0].source.initialProductionOffset = 1ms
*.gm.app[0].io.interface = "eth0"
*.gm.app[0].io.remoteAddress = "slave"
*.slave.numApps = 1
*.slave.app[0].typename = "EthernetSinkApp"
*.slave.app[0].io.interface = "eth0"
*.slave.app[0].io.steal = true
*.slave.app[0].io.localAddress = "slave"
# translators: M2-S4 Pdelay termination (NW-TT requester toward the GM; DS-TT responder)
*.tt*.eth[1].trafficConditionerLayer.typename = "nasctime.m2.TtPdelayPort"
*.tt*.eth[1].trafficConditionerLayer.terminate = true
*.tt*.eth[1].trafficConditionerLayer.responder = true
*.ttN.eth[1].trafficConditionerLayer.requester = true
*.ttN.eth[1].trafficConditionerLayer.engine.clockIdentity = "0x00000000000000a1"
*.ttD.eth[1].trafficConditionerLayer.engine.clockIdentity = "0x00000000000000d1"
*.tt*.eth[1].trafficConditionerLayer.engine.selfTest = true
**.trafficConditionerLayer.engine.logFile = "${resultdir}/m2log/${configname}-${repetition}/" + fullPath()
**.trafficConditionerLayer.**.statistic-recording = false
# PCAP (pcapng, 1 ps) on every port
*.gm.numPcapRecorders = 1
*.gm.pcapRecorder[0].moduleNamePatterns = "eth[0]"
*.slave.numPcapRecorders = 1
*.slave.pcapRecorder[0].moduleNamePatterns = "eth[0]"
*.tt*.numPcapRecorders = 2
*.tt*.pcapRecorder[0].moduleNamePatterns = "eth[0]"
*.tt*.pcapRecorder[1].moduleNamePatterns = "eth[1]"
**.pcapRecorder[*].fileFormat = "pcapng"
**.pcapRecorder[*].timePrecision = 12
**.pcapRecorder[*].pcapFile = "${resultdir}/pcap/${configname}-${repetition}/" + fullPath() + ".pcapng"
**.pcapRecorder[*].verbose = false

[Config M2S5U-passive]
description = "M2-S5 unit gate G0: M2S5U-base with TtPtpPort (correction off)"
extends = M2S5U-base
*.tt*.eth[1].trafficConditionerLayer.typename = "nasctime.m2.TtPtpPort"

# M2S5-nw (abstract): NW-TT ingress on (Follow_Up + Lup, TtSyncIngressTag), logs, self-test,
# containment audit on the gPTP slave's eth[0].
[Config M2S5-nw]
description = "(abstract) M2S5-passive + NW-TT ingress correction"
extends = M2S5-passive
*.nwTt.eth[1].trafficConditionerLayer.syncIngress = true
*.nwTt.eth[1].trafficConditionerLayer.syncIn.ttId = 1
*.dsTt.eth[1].trafficConditionerLayer.syncOut.ttId = 2
*.nwTt.eth[1].trafficConditionerLayer.syncIn.selfTest = true
**.trafficConditionerLayer.syncIn.logFile = "${resultdir}/m2log/${configname}-${repetition}/" + fullPath()
**.trafficConditionerLayer.syncOut.logFile = "${resultdir}/m2log/${configname}-${repetition}/" + fullPath()
*.talker.eth[0].trafficConditionerLayer.typename = "nasctime.m2.TtSyncAuditLayer"

# M2S5-v0*: gate V0 (design 6.0). NW-TT ingress on, DS-TT in audit mode (logs the tag of
# every Follow_Up it transmits, changes nothing). INVALID tags are produced by a late first
# link delay (Follow_Ups 0 and 1: noLinkDelay) and a Follow_Up with a foreign sequenceId
# (fuMismatch), on the idle, fragmented and loaded paths.
[Config M2S5-v0]
description = "M2-S5 gate V0: INVALID-tag survival NW-TT -> DS-TT (DS-TT audit only)"
extends = M2S5-nw
*.dsTt.eth[1].trafficConditionerLayer.syncEgressAudit = true
*.nwTt.eth[1].trafficConditionerLayer.engine.pdelayInitialOffset = 0.3s
*.listener.eth[0].trafficConditionerLayer.typename = "nasctime.m2.SyncFaultInjectorLayer"
*.listener.eth[0].trafficConditionerLayer.injector.action = "rewrite"
*.listener.eth[0].trafficConditionerLayer.injector.messageTypes = "8"
*.listener.eth[0].trafficConditionerLayer.injector.sequenceIds = "5 20"
*.listener.eth[0].trafficConditionerLayer.injector.field = "sequenceId"
*.listener.eth[0].trafficConditionerLayer.injector.value = 1000

[Config M2S5-v0-frag]
description = "M2-S5 gate V0, N3 fragmentation"
extends = M2S5-v0, M2S0-frag-n3

[Config M2S5-v0-load]
description = "M2-S5 gate V0, saturating load"
extends = M2S5-v0, M2S0-load-traffic

# M2S5: the experiment. NW-TT ingress and DS-TT egress correction.
[Config M2S5]
description = "M2-S5: M2S4 + online DL two-step correction (NW-TT +Lup, DS-TT +Res)"
extends = M2S5-nw
*.dsTt.eth[1].trafficConditionerLayer.syncEgress = true

[Config M2S5-frag]
description = "M2-S5 with N3 fragmentation"
extends = M2S5, M2S0-frag-n3

[Config M2S5-load]
description = "M2-S5 under saturating load, 5 HARQ processes"
extends = M2S5, M2S0-load-traffic

[Config M2S5-load-harq16]
description = "M2-S5 under saturating load, 16 HARQ processes"
extends = M2S5, M2S0-load-traffic, M2S0-harq16

# S4: the slave clock starts 1.234567891 ms ahead of the GM
[Config M2S5-offset]
description = "S4: M2S5 with an initial slave clock offset"
extends = M2S5
*.talker.clock.initialClockTime = 1.234567891ms

