*.ttB.eth[1].measurementLayer.injector.sequenceIds = "6"

[Config M2S4U-F4]
description = "F4: Resp_Follow_Up seq 7 duplicated (after completion)"
extends = M2S4U-fault-base
*.ttB.eth[1].measurementLayer.injector.action = "dup"
*.ttB.eth[1].measurementLayer.injector.messageTypes = "10"
*.ttB.eth[1].measurementLayer.injector.sequenceIds = "7"

[Config M2S4U-F5]
description = "F5: a Resp_Follow_Up seq 8 delivered ahead of Resp seq 8 (reordering medium)"
