*.ttB.eth[1].measurementLayer.injector.sequenceIds = "14"
*.ttB.eth[1].measurementLayer.injector.field = "domainNumber"
*.ttB.eth[1].measurementLayer.injector.value = 1

[Config M2S4U-F9d]
description = "F9d: Resp seq 15 truncated to 40 B"
extends = M2S4U-fault-base
*.ttB.eth[1].measurementLayer.injector.action = "truncate"
*.ttB.eth[1].measurementLayer.injector.messageTypes = "3"
*.ttB.eth[1].measurementLayer.injector.sequenceIds = "15"
*.ttB.eth[1].measurementLayer.injector.truncateTo = 40

[Config M2S4U-F10]
description = "F10: Resp seq 16 with an inverted FCS"
extends = M2S4U-fault-base
*.ttB.eth[1].measurementLayer.injector.action = "badFcs"
