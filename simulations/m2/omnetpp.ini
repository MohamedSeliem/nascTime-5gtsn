*.ttB.eth[1].measurementLayer.injector.sequenceIds = "10"
*.ttB.eth[1].measurementLayer.injector.field = "sequenceId"
*.ttB.eth[1].measurementLayer.injector.value = 999

[Config M2S4U-F8]
description = "F8: Resp seq 11 with requestingPortIdentity.portNumber 9"
extends = M2S4U-fault-base
*.ttB.eth[1].measurementLayer.injector.action = "rewrite"
*.ttB.eth[1].measurementLayer.injector.messageTypes = "3"
*.ttB.eth[1].measurementLayer.injector.sequenceIds = "11"
*.ttB.eth[1].measurementLayer.injector.field = "requestingPortNumber"
*.ttB.eth[1].measurementLayer.injector.value = 9

[Config M2S4U-F9a]
description = "F9a: Resp seq 12 with versionPTP 1"
extends = M2S4U-fault-base
*.ttB.eth[1].measurementLayer.injector.action = "rewrite"
*.ttB.eth[1].measurementLayer.injector.messageTypes = "3"
*.ttB.eth[1].measurementLayer.injector.sequenceIds = "12"
*.ttB.eth[1].measurementLayer.injector.field = "versionPTP"
*.ttB.eth[1].measurementLayer.injector.value = 1

[Config M2S4U-F9b]
description = "F9b: Resp seq 13 with messageLength 50"
extends = M2S4U-fault-base
*.ttB.eth[1].measurementLayer.injector.action = "rewrite"
