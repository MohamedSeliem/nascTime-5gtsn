*.ttB.eth[1].measurementLayer.injector.sequenceIds = "16"

[Config M2S4U-F11]
description = "F11: Resp seq 17-21 dropped (5 consecutive losses, allowedLostResponses 3)"
extends = M2S4U-fault-base
