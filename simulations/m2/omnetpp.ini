*.ttB.eth[1].measurementLayer.injector.action = "fuBefore"
*.ttB.eth[1].measurementLayer.injector.messageTypes = "3"
*.ttB.eth[1].measurementLayer.injector.sequenceIds = "8"

[Config M2S4U-F6]
