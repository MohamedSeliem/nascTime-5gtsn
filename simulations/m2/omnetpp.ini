# M2-S0: chunk-level timestamp tag as internal metadata carriage (architecture
# validation; see migration/m2-s0-design.md). Runs on the M1 network and configs
# (included below, unchanged) with libnasctime_m2 loaded:
#   opp_run -l <nascTime>/src/nasctime/m2/nasctime_m2 -l $SIMU5G_ROOT/src/simu5g ...
# No translator is implemented: the translators stay nasctime.tt.PassThroughTt; the
# TtTimestampLayer is placed in the (default-empty) measurement-layer slot of their
# TSN-side port eth[1], and of the stations' eth[0] (audit), from ini only.

include ../m1/omnetpp.ini

#------------------------------------#
# M2S0-base (not run on its own): Config S5 without INET's MeasurementLayer on the
# translators' 5G-side ports (as S5-nomeas), with PCAP everywhere a frame is observed:
# stations eth[0], both translator ports, N3. pcapng with 1 ps resolution, so that PCAP
# times are exact simulation times.
#
[Config M2S0-base]
description = "M2-S0 base: S5 without INET measurement layers, PCAP (pcapng, ps) on stations, translator ports and N3"
extends = S5
network = nasctime.simulations.m1.M1Bridge
*.*Tt.eth[0].measurementLayer.typename = ""
*.talker.numPcapRecorders = 1
*.listener.numPcapRecorders = 1
*.talker.pcapRecorder[0].moduleNamePatterns = "eth[0]"
*.listener.pcapRecorder[0].moduleNamePatterns = "eth[0]"
*.*Tt.numPcapRecorders = 2
*.*Tt.pcapRecorder[0].moduleNamePatterns = "eth[0]"
*.*Tt.pcapRecorder[1].moduleNamePatterns = "eth[1]"
*.upf.numPcapRecorders = 1
*.upf.pcapRecorder[0].moduleNamePatterns = "ppp[0]"
**.pcapRecorder[*].fileFormat = "pcapng"
**.pcapRecorder[*].timePrecision = 12
**.pcapRecorder[*].pcapFile = "${resultdir}/pcap/${configname}-${repetition}/" + fullPath() + ".pcapng"
**.pcapRecorder[*].verbose = false
**.fcsMode = "computed"
**.checksumMode = "computed"
# per-frame logs of the TtTimestampLayers (none exist in the base config); their generic
# packet-flow statistics are not recorded (their own counters are recorded as scalars)
**.measurementLayer.logFile = "${resultdir}/m2log/${configname}-${repetition}/" + fullPath()
**.measurementLayer.**.statistic-recording = false

#------------------------------------#
# M2S0-off: the equality control. Exactly M2S0-base: no TtTimestampLayer anywhere.
#
[Config M2S0-off]
description = "M2-S0 control: no TtTimestampLayer"
extends = M2S0-base

#------------------------------------#
# M2S0-probe: packet structure at the insertion points before anything is changed.
# TtTimestampLayer in mode "probe" (records the chunk structure of every frame, changes
# nothing) on both translators' eth[1] (RX and TX) and both stations' eth[0]; with the
# synthetic-frame self-test of the structure check and of the tag round trip.
#
[Config M2S0-probe]
description = "M2-S0 probe: chunk structure at the measurement-layer slots, no change to any frame"
extends = M2S0-base
*.*Tt.eth[1].measurementLayer.typename = "nasctime.m2.TtTimestampLayer"
*.talker.eth[0].measurementLayer.typename = "nasctime.m2.TtTimestampLayer"
*.listener.eth[0].measurementLayer.typename = "nasctime.m2.TtTimestampLayer"
**.measurementLayer.mode = "probe"
*.nwTt.eth[1].measurementLayer.ttId = 1
*.dsTt.eth[1].measurementLayer.ttId = 2
*.nwTt.eth[1].measurementLayer.selfTest = true

#------------------------------------#
# Variants, combined with the probe and with M2S0 by multiple inheritance.
#
# M2S0-frag-n3: N3 PPP MTU 128 B at the UPF and the gNB, so that every GTP-U datagram
# is IPv4-fragmented on N3 and reassembled by INET (byte slicing of the frame).
[Config M2S0-frag-n3]
description = "(variant) N3 PPP MTU 128 B: every GTP-U datagram fragmented"
extends = M2S0-base
*.upf.ppp[0].ppp.mtu = 128B
*.gnb1.pppIf.ppp.mtu = 128B

# M2S0-load-traffic: S3-load's saturating background in both directions (VLAN 42 PCP 0,
# default DRB, 1400 B every 0.25 ms) as app[3], with a sequence-numbered payload. Every
# source stops at 3 s and the run continues to 5 s (as O1-drain), so a frame that is
# not delivered was lost, not still in flight. gPTP keeps running to 5 s.
[Config M2S0-load-traffic]
description = "(variant) saturating PCP 0 background both directions, sources stop at 3 s"
extends = M2S0-base
*.talker.numApps = 4
*.listener.numApps = 4
**.app[3].typename = "EthernetSourceApp"
**.app[3].source.packetLength = 1400B
**.app[3].source.packetRepresentation = "applicationPacket"
**.app[3].source.productionInterval = simTime() < 3s ? 0.25ms : 1000s
**.app[3].source.initialProductionOffset = 0.1s + 500us
**.app[3].io.interface = "eth0"
**.app[3].tagger.typename = "PacketTagger"
**.app[3].tagger.vlanId = 42
**.app[3].tagger.pcp = 0
**.app[3].tagger.encapsulationProtocols = ["ieee8021qctag"]
*.talker.app[3].io.remoteAddress = "listener"
*.listener.app[3].io.remoteAddress = "talker"
**.app[0..1].source.productionInterval = simTime() < 3s ? 20ms : 1000s

# 16 HARQ processes at the gNB and the UE (O-S3-1 counterfactual): no MAC discard
[Config M2S0-harq16]
description = "(variant) 16 HARQ processes"
extends = M2S0-base
*.gnb1.cellularNic.mac.harqProcesses = 16
*.ue[0].cellularNic.nrMac.harqProcesses = 16

[Config M2S0-probe-frag]
description = "M2-S0 probe, N3 fragmentation"
extends = M2S0-probe, M2S0-frag-n3

[Config M2S0-probe-load]
description = "M2-S0 probe, saturating load (5 HARQ processes)"
extends = M2S0-probe, M2S0-load-traffic

#------------------------------------#
# Config M2S0: the experiment. TtTimestampLayer (mode translator) on both translators'
# TSN-side port eth[1]: every frame received there is tagged (ingress time, translator
# id, frame id); the opposite translator recovers, logs and strips the tag when the
# frame leaves on its eth[1]. Audit layers on both stations count frames that still
# carry a tag. Translator ids: nwTt 1, dsTt 2.
#
[Config M2S0]
description = "M2-S0: chunk-level TtTimestampTag added at each translator's TSN port, recovered and stripped at the other"
extends = M2S0-base
*.*Tt.eth[1].measurementLayer.typename = "nasctime.m2.TtTimestampLayer"
*.nwTt.eth[1].measurementLayer.ttId = 1
*.dsTt.eth[1].measurementLayer.ttId = 2
*.talker.eth[0].measurementLayer.typename = "nasctime.m2.TtTimestampLayer"
*.listener.eth[0].measurementLayer.typename = "nasctime.m2.TtTimestampLayer"
*.talker.eth[0].measurementLayer.mode = "audit"
*.listener.eth[0].measurementLayer.mode = "audit"
*.nwTt.eth[1].measurementLayer.selfTest = true

[Config M2S0-frag]
description = "M2-S0 with every GTP-U datagram IPv4-fragmented on N3"
extends = M2S0, M2S0-frag-n3

[Config M2S0-load]
description = "M2-S0 under saturating load, 5 HARQ processes (MAC discard expected)"
extends = M2S0, M2S0-load-traffic

[Config M2S0-load-harq16]
description = "M2-S0 under saturating load, 16 HARQ processes (control)"
extends = M2S0, M2S0-load-traffic, M2S0-harq16

[Config M2S0-load-off]
description = "M2-S0-load equality control: no TtTimestampLayer"
extends = M2S0-off, M2S0-load-traffic

#------------------------------------#
# Negative controls (seed 0). Each changes one test-only knob; the checker must fail
# exactly the rows named here and pass all others.
#   nc-noingress: dsTt does not tag             -> UL A1-A4 (no UL frame recoverable)
#   nc-offset:    nwTt ingress time + 1 ns      -> DL A2, DL A4 (deviation exactly +1 ns)
#   nc-id:        nwTt frame-id stride 2        -> DL A3
#   nc-nostrip:   no stripping at either egress -> A10
[Config M2S0-nc-noingress]
description = "M2-S0 negative control: DS-TT ingress tagging off"
extends = M2S0
*.dsTt.eth[1].measurementLayer.tagAtIngress = false

[Config M2S0-nc-offset]
description = "M2-S0 negative control: NW-TT ingress time + 1 ns"
extends = M2S0
*.nwTt.eth[1].measurementLayer.timestampOffset = 1ns

[Config M2S0-nc-id]
description = "M2-S0 negative control: NW-TT frame ids 2, 4, 6, ..."
extends = M2S0
*.nwTt.eth[1].measurementLayer.frameIdStride = 2

[Config M2S0-nc-nostrip]
description = "M2-S0 negative control: tags not stripped at egress"
extends = M2S0
*.*Tt.eth[1].measurementLayer.stripAtEgress = false
