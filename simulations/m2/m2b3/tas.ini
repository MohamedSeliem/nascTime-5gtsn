# M2B-3 (docs/migration/m2b-3-tas-qbv.md): TEST-ONLY, opt-in IEEE 802.1Qbv configurations of the 5G-TSN bridge.
# Every config extends the ACCEPTED M2S72-B-q0-Eall-n2 (M2S72Bridge, N = 2, the A2 TtClock in every translator;
# m2s72.ini is included unchanged) and adds only: a bounded run length, result paths, data-frame PCAP at the
# translators' TSN-side ports, gate / queue vectors, and (TAS configs) the S-CFG/2 output of scfg/s72-q0-tas.json.
# Functional development tests (level 2): no scientific result, no timing-equivalence claim.
# Used by simulations/m2/check/test_m2b3_tas_bridge.py.
include ../m2s72.ini

[Config TAS-common]
description = "(abstract) M2S72-B-q0-Eall-n2, 0.8 s, recordings for the TAS functional tests; TAS off"
extends = M2S72-B-q0-Eall-n2
sim-time-limit = 0.8s
# per-config result paths (the accepted config writes under a fixed results/... path)
**.pcapRecorder[*].pcapFile = "${resultdir}/pcap/${configname}-${repetition}/" + fullPath() + ".pcapng"
**.measurementLayer.logFile = "${resultdir}/m2log/${configname}-${repetition}/" + fullPath()
# data frames too at both ports of every translator (the accepted filter records gPTP / Pdelay only)
*.nwTt.pcapRecorder[*].packetFilter = "*"
*.dsTt[*].pcapRecorder[*].packetFilter = "*"
# gate and per-traffic-class queue behaviour of the translators' egress queues
*.*Tt*.eth[*].macLayer.queue.transmissionGate[*].gateState:vector.vector-recording = true
*.*Tt*.eth[*].macLayer.queue.queue[*].incomingPacketLengths:vector.vector-recording = true
*.*Tt*.eth[*].macLayer.queue.queue[*].queueingTime:vector.vector-recording = true
*.*Tt*.eth[*].macLayer.queue.queue[*].queueLength:vector.vector-recording = true
*.*Tt*.eth[*].macLayer.queue.queueingTime:vector.vector-recording = true
*.*Tt*.**.ttClock.*.param-recording = true

[Config TAS-off]
description = "A: TAS disabled (the accepted configuration with recordings only)"
extends = TAS-common

[Config TAS-open]
description = "A': TAS infrastructure on (shaper, TtGateClock, explicit binding), every gate always open"
extends = TAS-common
*.nwTt.eth[1].measurementLayer.observePort = false
*.dsTt[*].eth[1].measurementLayer.observePort = false
*.nwTt.hasEgressTrafficShaping = true
*.dsTt[*].hasEgressTrafficShaping = true
*.nwTt.clock.typename = "nasctime.m2.TtGateClock"
*.dsTt[*].clock.typename = "nasctime.m2.TtGateClock"
*.nwTt.eth[*].macLayer.queue.transmissionGate[*].clockModule = "^.^.^.^.clock"
*.dsTt[*].eth[*].macLayer.queue.transmissionGate[*].clockModule = "^.^.^.^.clock"
*.nwTt.eth[*].macLayer.queue.classifier.defaultGateIndex = 7
*.dsTt[*].eth[*].macLayer.queue.classifier.defaultGateIndex = 7

[Config TAS-gated]
description = "B-D: the S-CFG/2 schedule of scfg/s72-q0-tas.json (DS-TT TSN port: TC5 2/10 ms, TC1 (PCP 0) 5/10 ms; NW-TT TSN port: TC5 / TC1 alternating, 4 ms)"
extends = TAS-common
# the M2-S1 FIFO egress pairer is not used with per-class queues (see the document, section 5)
*.nwTt.eth[1].measurementLayer.observePort = false
*.dsTt[*].eth[1].measurementLayer.observePort = false
include s72-q0-tas.scfg.ini

[Config TAS-tt]
description = "E: as TAS-gated; dsTt[1]'s TT clock with theta0 = +400 us and y = +200 ppm (gates must follow its TT time)"
extends = TAS-gated
*.dsTt[1].eth[1].trafficConditionerLayer.ttClock.theta0 = 400us
*.dsTt[1].eth[1].trafficConditionerLayer.ttClock.freqOffsetPpb = 200000

[Config TASN-unbound]
description = "NEGATIVE: as TAS-tt without the explicit gate binding of the DS-TTs (gates on simulation time)"
extends = TAS-tt
*.dsTt[*].eth[*].macLayer.queue.transmissionGate[*].clockModule = ""

[Config TASN-pairer]
description = "INVESTIGATION: as TAS-gated with the accepted M2-S1 FIFO egress pairer (observePort) left on"
extends = TAS-gated
*.nwTt.eth[1].measurementLayer.observePort = true
*.dsTt[*].eth[1].measurementLayer.observePort = true

[Config TASN-phase]
description = "NEGATIVE: as TAS-gated with the DS-TTs' TC5 gate phase off by 1 ns (the oracle must detect it)"
extends = TAS-gated
*.dsTt[*].eth[1].macLayer.queue.transmissionGate[5].offset = 1ns
