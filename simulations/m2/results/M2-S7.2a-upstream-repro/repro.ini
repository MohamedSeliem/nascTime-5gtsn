# Minimal reproduction for the Simu5G v1.8.0 scheduleGrant capped-grant deactivation (LteSchedulerEnb.cc:403).
# Isolated from nascTime: only the upstream example simulations/nr/standalone_drb (unchanged, included) is used.
# One NR UE, saturating UL UDP (1400 B every 0.25 ms = 44.8 Mb/s) to the server; UL scheduler QOS_PF vs MAXCI.
include /root/stack/simu5g-1.8.0/simulations/nr/standalone_drb/omnetpp.ini

[Config Repro-UL]
extends = Standalone
sim-time-limit = 3s
*.numUe = 1
*.ue[0].numApps = 1
*.server.numApps = 1
*.ue[0].app[0].typename = "UdpBasicApp"
*.ue[0].app[0].destAddresses = "server"
*.ue[0].app[0].destPort = 4000
*.ue[0].app[0].localPort = 4001
*.ue[0].app[0].messageLength = 1400B
*.ue[0].app[0].sendInterval = 0.25ms
*.ue[0].app[0].startTime = 0.1s
*.server.app[0].typename = "UdpSink"
*.server.app[0].localPort = 4000
*.gnb.cellularNic.mac.cmdenv-log-level = info
**.cmdenv-log-level = off
cmdenv-log-prefix = "%t|%M|"

[Config Repro-UL-QOSPF]
extends = Repro-UL
*.gnb.cellularNic.mac.schedulingDisciplineUl = "QOS_PF"

[Config Repro-UL-MAXCI]
extends = Repro-UL
*.gnb.cellularNic.mac.schedulingDisciplineUl = "MAXCI"
