# M2B-4 (docs/migration/m2b-4-tas-residence.md): TEST-ONLY B6 configurations - bridge-residence observation
# (M2-S1, R = t12 - t1) with IEEE 802.1Qbv TAS active. They extend the M2B-3 test configurations of
# ../m2b3/tas.ini (included unchanged; it includes the accepted m2s72.ini unchanged) and only switch the M2-S1
# port observation back on at the shaped ports with the TAS pairing mode. Functional development tests
# (level 2); no scientific result. Used by simulations/m2/check/test_m2b4_residence.py.
include ../m2b3/tas.ini

[Config RES-off]
description = "B6 reference: TAS off (M2B-3 TAS-off: the accepted configuration, FIFO pairing, observePort as accepted)"
extends = TAS-off

[Config RES-tas]
description = "B6: M2B-3 TAS-gated with observePort back on at the gated TSN ports and the TAS pairing mode at every shaped port"
extends = TAS-gated
*.nwTt.eth[1].measurementLayer.observePort = true
*.dsTt[*].eth[1].measurementLayer.observePort = true
*.nwTt.eth[*].measurementLayer.pairingMode = "tas"
*.dsTt[*].eth[*].measurementLayer.pairingMode = "tas"

[Config RESN-fifo]
description = "NEGATIVE: as RES-tas with the accepted FIFO pairing (valid TAS overtaking must be refused as out-of-order)"
extends = RES-tas
*.nwTt.eth[*].measurementLayer.pairingMode = "fifo"
*.dsTt[*].eth[*].measurementLayer.pairingMode = "fifo"

[Config RESN-rotate]
description = "NEGATIVE: as RES-tas with the M2-S1 TEST-ONLY identity rotation at the DS-TT TSN ports (wrong frame identities in the log)"
extends = RES-tas
*.dsTt[*].eth[1].measurementLayer.pairingTest = "rotate"

[Config RESN-offset]
description = "NEGATIVE: as RES-tas with the M2-S1 TEST-ONLY ingress-time offset of +1 ns at the NW-TT TSN port (wrong t1 for DL frames)"
extends = RES-tas
*.nwTt.eth[1].measurementLayer.timestampOffset = 1ns
