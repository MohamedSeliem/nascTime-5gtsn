# M2B-5 (docs/migration/m2b-5-common-epoch.md): TEST-ONLY common-epoch TAS configurations of the 5G-TSN bridge.
# They extend the M2B-3 abstract TAS-common (../m2b3/tas.ini, included unchanged; it extends the accepted
# M2S72-B-q0-Eall-n2 of m2s72.ini, included unchanged) and add the S-CFG/2 common-epoch output of
# scfg/s72-q0-epoch.json (NW-TT and both DS-TTs, same schedule, base 0), the M2B-4 TAS pairing mode at every shaped
# port with the accepted M2-S1 observation (observePort as accepted, i.e. on), and per-config TT clock variations.
# Functional development tests (level 2): no scientific result. Used by simulations/m2/check/test_m2b5_epoch_bridge.py.
include ../m2b3/tas.ini

[Config EPO-gated]
description = "common epoch (base 0) at NW-TT and both DS-TTs; accepted TT clocks; M2-S1 observation with TAS pairing"
extends = TAS-common
*.nwTt.eth[*].measurementLayer.pairingMode = "tas"
*.dsTt[*].eth[*].measurementLayer.pairingMode = "tas"
include s72-q0-epoch.scfg.ini

[Config EPO-clocks]
description = "as EPO-gated with different TT clocks: theta0 NW-TT 1 ms, DS-TT[1] 3.3 ms; y DS-TT[0] +200 ppm, DS-TT[1] -200 ppm (5G updates as accepted)"
extends = EPO-gated
*.nwTt.eth[1].trafficConditionerLayer.ttClock.theta0 = 1ms
*.dsTt[1].eth[1].trafficConditionerLayer.ttClock.theta0 = 3.3ms
*.dsTt[0].eth[1].trafficConditionerLayer.ttClock.freqOffsetPpb = 200000
*.dsTt[1].eth[1].trafficConditionerLayer.ttClock.freqOffsetPpb = -200000

[Config EPON-unbound]
description = "NEGATIVE: the DS-TT gates without the explicit TT gate-clock binding (they must refuse simulation time)"
extends = EPO-gated
*.dsTt[*].eth[*].macLayer.queue.transmissionGate[*].clockModule = ""

[Config EPON-base1ns]
description = "NEGATIVE: the DS-TT TSN-port gates run with base 1 ns while 0 is declared (the oracle must detect it)"
extends = EPO-gated
*.dsTt[*].eth[1].macLayer.queue.transmissionGate[*].baseTime = 1ns

[Config EPON-future]
description = "NEGATIVE: base time 1 s at the DS-TT TSN port, later than the TT clock at initialization (activation refused)"
extends = EPO-gated
*.dsTt[*].eth[1].macLayer.queue.transmissionGate[*].baseTime = 1s
