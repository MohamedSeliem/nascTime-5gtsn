# M2-R181c: version-appropriate M2-S5 negative controls for Simu5G 1.8.1.
# omnetpp.ini is included unchanged; every M2S5 / M2S5-nc-* configuration and its historical control stays as it was.
include omnetpp.ini

# N-tseSlot-v. The historical N-tseSlot (M2S5-nc-tseSlot, idle) has no effect on 1.8.1: there the Sync never queues at the
# DS-TT egress (TSe = slot time for 78/78). Under saturating load it does (24 of 39 Syncs wait 10.864 us, seed 0), so the
# same mutation produces a wrong correction there. Base: M2S5-load.
[Config M2S5R-nc-tseSlot-load]
description = "M2-R181c N-tseSlot-v: DS-TT takes TSe when the Sync passes its slot, under saturating load"
extends = M2S5-nc-tseSlot, M2S0-load-traffic

# N-noFcsNw-v. The historical N-noFcsNw starts the slave clock exact (initial offset 0): a slave that never receives a
# Follow_Up is then indistinguishable in S3 from one that is stepped by exactly zero (1.8.1: Sync timing unchanged by the
# missing Follow_Ups). With the initial offset of M2S5-offset the slave must be stepped to become exact. Base: M2S5-offset.
[Config M2S5R-nc-noFcsNw-offset]
description = "M2-R181c N-noFcsNw-v: NW-TT does not recompute the FCS, slave clock with an initial offset"
extends = M2S5-nc-noFcsNw
*.talker.clock.initialClockTime = 1.234567891ms

# The M2-S4 reference for S3 of the two offset runs (base M2S5-offset and N-noFcsNw-v). S3 predicts the slave clock from
# the M2-S4 records; with the initial offset, the slave's clock-driven Pdelay timing differs from M2S4 (offset 0), so the
# reference must carry the same initial offset. The historical checker evaluates M2S5-offset without S3 (R4 = None).
[Config M2S4R-offset]
description = "M2-R181c: M2S4 with the initial slave clock offset of M2S5-offset (S3 reference)"
extends = M2S4
*.talker.clock.initialClockTime = 1.234567891ms
