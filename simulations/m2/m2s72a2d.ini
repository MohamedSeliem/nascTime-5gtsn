# M2-S7.2a work package A2 (DR-07a): the FULL-CONTRACT H-ARQ DIAGNOSTIC configuration and its non-perturbation twin.
# Protocol: results/M2-S7.2a-a2d-protocol.md. DEVELOPMENT LEVEL: no run is authorised by this file (V-6 is the
# independent execution). Hand-written, not generated, like m2s72a2v.ini; m2s72s5.ini (and through it m2s72.ini) is
# included unchanged and this file only ADDS sections. Every new name carries the suffix _A2D / _A2DREF, which the
# E0v-N tooling refuses (WP-A1 run-name guard): a diagnostic is never an E0v-N campaign run.
#
# DR-07a (decision 17 Nov 2026): full-contract diagnostics are a DECLARED configuration with
#   (1) scheduler logging on, as a default-off mixin   -> M2S72A2D-schedlog
#   (2) declared NACK injection, the A2-V1 mixin pattern (m2s72a2v.ini) -> M2S72A2D-nack-all
#       A2-D1 (maintainer, step 162-R1, PROVISIONAL): perDl = 0.3, harqReduction = 1 on the N = 2 A2-V1-derived base
#       approved as the declared diagnostic configuration. This approves the configuration DESIGN only: not the V-6
#       execution, not any result, not any scientific acceptance.
#   (3) declared minimum counts before the run (protocol §4)
#   (4) a non-perturbation twin with and without scheduler logging, identical on the non-log outputs
#       -> M2S72-E0vN-q0-one0-n2-f1_A2D (logging on) vs M2S72-E0vN-q0-one0-n2-f1_A2DREF (logging off)
#
# Mechanism (Simu5G 1.8.1, unmodified; the same as A2-V1): the upstream IdealChannelModel. A DL transport block of UE n
# fails decoding with probability perDl * harqReduction^(k-1) on its k-th attempt (IdealChannelModel::
# isReceptionSuccessful); the UE's H-ARQ RX answers NACK and the gNB retransmits the same MAC PDU at most
# maxHarqRtx = 3 times (LteMacBase.ned default, unchanged); after the 4th failed attempt the PDU is discarded.
# harqReduction = 1: independent, identically distributed attempts. The loss draws come from physical RNG 4
# (seed-4-mt = 400<repetition>), so the injection is deterministic for a given repetition and identical in both twins.
# RNG 4 is SHARED, not isolated (step 162-R2, protocol §2.3): the two rng-0 entries below (the A2-V1 pattern) also map
# the gNB's IdealChannelModel, which draws once per received UL transport block, and the UEs' detached LTE-leg
# channel models onto it, and both UEs' DL error draws use the one stream.
# Scheduler evidence (A2-4c, RC-2 of the F1 root cause): LteSchedulerEnbDl::rtxAcid (LteSchedulerEnbDl.cc:108) logs
# "rtxAcid - Node [g], User[n], ... ACID [p]" under the SUBMODULE mac.schedulerDl, whose log level is off in every
# accepted configuration (**.cmdenv-log-level = off; only mac itself is info). The mixin turns on that one module.

include m2s72s5.ini

[Config M2S72A2D-schedlog]
description = "(mixin, A2 / DR-07a, DIAGNOSTIC ONLY, default off) the DL scheduler submodule's own log lines (rtxAcid naming node and process) on stdout; changes logging only"
*.gnb1.cellularNic.mac.schedulerDl.cmdenv-log-level = info

[Config M2S72A2D-nack-all]
description = "(mixin, A2 / DR-07a, DIAGNOSTIC ONLY) IdealChannelModel at gNB and UEs; DL decoding error perDl = 0.3 per attempt on EVERY UE (A2-D1, provisionally approved design), independent attempts; all UL loss-free; loss draws on physical RNG 4, shared with the gNB UL channel model (not isolated)"
*.gnb1.cellularNic.channelModelType = "IdealChannelModel"
*.ue[*].cellularNic.nrChannelModelType = "IdealChannelModel"
*.ue[*].cellularNic.nrChannelModel[*].perDl = 0.3
*.ue[*].cellularNic.nrChannelModel[*].harqReduction = 1
**.perDl = 0
**.perUl = 0
**.perD2D = 0
num-rngs = 5
seed-4-mt = 400${repetition}
**.channelModel[*].rng-0 = 4
**.nrChannelModel[*].rng-0 = 4

[Config M2S72-E0vN-q0-one0-n2-f1_A2D]
description = "A2 full-contract diagnostic (DR-07a; not authorised): M2S72-E0vN-q0-one0-n2-f1 unchanged + M2S72A2D-nack-all + M2S72A2D-schedlog; single run, seed 0"
extends = M2S72A2D-schedlog, M2S72A2D-nack-all, M2S72-E0vN-q0-one0-n2-f1

[Config M2S72-E0vN-q0-one0-n2-f1_A2DREF]
description = "A2 non-perturbation twin of M2S72-E0vN-q0-one0-n2-f1_A2D (not authorised): identical except that M2S72A2D-schedlog is absent"
extends = M2S72A2D-nack-all, M2S72-E0vN-q0-one0-n2-f1
