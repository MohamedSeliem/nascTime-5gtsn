# Minimal reproductions of three Simu5G 1.8.0 issues found by nascTime M1.
# Self-contained against Simu5G 1.8.0 only (no nascTime code or NED): copy this file
# into Simu5G's simulations/nr/ethernet/ next to its omnetpp.ini and run, e.g.
#   opp_run -l <simu5g>/src/simu5g -n <simu5g>/src:<inet>/src -u Cmdenv -f issues.ini -c Issue1-HarqDiscard -r 0
# Every config extends Simu5G's own Ethernet-Bridge config (one UE in Ethernet bridge
# mode, device[0] behind it, dnStation on the UPF's N6 LAN; PCP 5 -> DRB 2, rest -> DRB 1).
include omnetpp.ini

# ---------------------------------------------------------------------------------------
# Issue 1: MAC PDUs (with RLC PDUs already taken from RLC) are deleted when no HARQ TX
# process is free, and no statistic records it.
# A saturating PCP 0 background flow in both directions; all sources stop at 3 s and the
# run continues to 5 s, so nothing is "still in flight" at the end.
[Config Issue1-HarqDiscard]
extends = Ethernet-Bridge
*.device[0].numApps = 4
*.dnStation.numApps = 4
**.app[0..1].source.productionInterval = simTime() < 3s ? 20ms : 1000s
**.app[3].typename = "EthernetSourceApp"
**.app[3].source.packetLength = 1400B
**.app[3].source.productionInterval = simTime() < 3s ? 0.25ms : 1000s
**.app[3].source.initialProductionOffset = 0.1s + 500us
**.app[3].io.interface = "eth0"
**.app[3].tagger.typename = "PacketTagger"
**.app[3].tagger.vlanId = 42
**.app[3].tagger.pcp = 0
**.app[3].tagger.encapsulationProtocols = ["ieee8021qctag"]
*.device[0].app[3].io.remoteAddress = "dnStation"
*.dnStation.app[3].io.remoteAddress = "device[0]"

# Counterfactual: the same with 16 HARQ processes (NR maximum) at gNB and UE.
[Config Issue1-HarqDiscard-16proc]
extends = Issue1-HarqDiscard
*.gnb1.cellularNic.mac.harqProcesses = 16
*.ue[0].cellularNic.nrMac.harqProcesses = 16

# The deletion is visible only in the MAC debug log.
[Config Issue1-HarqDiscard-trace]
extends = Issue1-HarqDiscard
sim-time-limit = 0.6s
**.app[0..1].source.productionInterval = simTime() < 0.4s ? 20ms : 1000s
**.app[3].source.productionInterval = simTime() < 0.4s ? 0.25ms : 1000s
cmdenv-express-mode = false
cmdenv-log-prefix = "%t %N | "
*.gnb1.cellularNic.mac.cmdenv-log-level = debug
*.ue[0].cellularNic.nrMac.cmdenv-log-level = debug
**.cmdenv-log-level = off

# ---------------------------------------------------------------------------------------
# Issue 2: the DL grant for an NR UM connection is sized with one RLC header for the whole
# queue; with >= 2 SDUs queued in one slot the last SDU can be cut, and its remainder
# waits until the next SDU arrives on that DRB (the connection is set inactive).
# Besides its PCP 0 flow (app[1], RLC SDU 120 B), dnStation sends two untagged flows
# (app[3]: 46 B payload -> RLC SDU 62 B; app[4]: 76 B -> 92 B) 1 and 2 us after it, so
# three SDUs reach DRB 1 in the same slot every 20 ms (the sizes of gPTP Sync and
# Follow_Up next to a data frame, where nascTime first saw it). The grant (278 B here)
# covers the demand (274 B + 2 B MAC + 1 B RLC = 277 B) but not the three PDUs
# (274 B + 3 x 1 B RLC + 2 B MAC = 279 B). Sources stop at 3 s; the run goes on to 5 s.
[Config Issue2-DlTailLag]
extends = Ethernet-Bridge
*.dnStation.numApps = 5
**.app[0..1].source.productionInterval = simTime() < 3s ? 20ms : 1000s
*.dnStation.app[3..4].typename = "EthernetSourceApp"
*.dnStation.app[3].source.packetLength = 46B
*.dnStation.app[4].source.packetLength = 76B
*.dnStation.app[3..4].source.productionInterval = simTime() < 3s ? 20ms : 1000s
*.dnStation.app[3..4].source.initialProductionOffset = 0.105s + 1us * (ancestorIndex(1) - 2)
*.dnStation.app[3..4].io.interface = "eth0"
*.dnStation.app[3..4].io.remoteAddress = "device[0]"
**.cellularNic.*.tx.receivedPacketFromUpperLayer.result-recording-modes = +vector(packetBytes)

# Counterfactual: the two extra flows 2 and 4 ms later, so every slot holds one SDU per DRB.
[Config Issue2-DlTailLag-apart]
extends = Issue2-DlTailLag
*.dnStation.app[3..4].source.initialProductionOffset = 0.105s + 2ms * (ancestorIndex(1) - 2)

# ---------------------------------------------------------------------------------------
# Issue 3: GtpUser rebuilds the packet from its data (new Packet + peekData()), so INET
# packet-level region tags (FlowTag, ElapsedTimeTag, ... used by INET's measurement
# framework) do not cross the 5G system, while chunk-level tags (CreationTimeTag) do.
# dnStation's PCP 0 flow starts an INET flow measurement; it is recorded on the UPF's N6
# interface (before GtpUser: control) and at device[0]'s sink (after the 5G system).
[Config Issue3-RegionTags]
extends = Ethernet-Bridge
*.dnStation.app[1].measurementStarter.typename = "FlowMeasurementStarter"
*.dnStation.app[1].measurementStarter.flowName = "dl"
*.dnStation.app[1].measurementStarter.measure = "elapsedTime"
*.upf.dnEth.measurementLayer.typename = "MeasurementLayer"
*.upf.dnEth.measurementLayer.measurementRecorder.flowName = "dl"
*.upf.dnEth.measurementLayer.measurementRecorder.measure = "elapsedTime"
*.upf.dnEth.measurementLayer.measurementRecorder.endMeasurement = false
*.device[0].app[2].measurementRecorder.typename = "FlowMeasurementRecorder"
*.device[0].app[2].measurementRecorder.flowName = "dl"
*.device[0].app[2].measurementRecorder.measure = "elapsedTime"
