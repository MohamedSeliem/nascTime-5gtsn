# M1: minimal 5G Ethernet bridge on vanilla OMNeT++ 6.4.0 / INET 4.7.0 / Simu5G 1.8.0.
# One [Config] per stage test; see migration/m1-plan.md. Plain ini, written by hand.

[General]
network = M1Bridge
sim-time-limit = 5s
**.routingRecorder.enabled = false
output-scalar-file = ${resultdir}/${configname}/${repetition}.sca
output-vector-file = ${resultdir}/${configname}/${repetition}.vec
seed-set = ${repetition}
**.vector-recording = true

**.mobility.constraintAreaMaxX = 1000m
**.mobility.constraintAreaMaxY = 1000m
**.mobility.constraintAreaMinX = 0m
**.mobility.constraintAreaMinY = 0m
**.mobility.constraintAreaMinZ = 0m
**.mobility.constraintAreaMaxZ = 0m
**.mobility.initFromDisplayString = false
**.numBands = 50
**.ueTxPower = 26dBm
**.eNodeBTxPower = 40dBm
**.targetBler = 0.01
**.blerShift = 5
# Same content as Simu5G 1.8.0 simulations/nr/standalone/demo.xml
*.configurator.config = xml("<config> \
    <interface among='eNB* eNodeB* enb* *Enb* gNB* gNodeB* gnb* *Gnb* upf* *Upf* mecHost* pgw*' address='10.x.x.x' netmask='255.255.255.0'/> \
    <interface hosts='*' address='192.168.x.x' netmask='255.255.255.0'/> \
    </config>")

*.gnb1.mobility.initialX = 450m
*.gnb1.mobility.initialY = 300m
*.ue[*].servingNodeId = 0
*.ue[*].nrServingNodeId = 1
*.ue[*].mobility.initialX = 450m + 30m * ancestorIndex(1)
*.ue[*].mobility.initialY = 350m

# Ethernet end stations: raw Ethernet hosts on INET's layered Ethernet stack, with 802.1Q
*.listener.hasIpv4 = false
*.talker.hasIpv4 = false
*.listener.eth[*].typename = "LayeredEthernetInterface"
*.talker.eth[*].typename = "LayeredEthernetInterface"
*.listener.ethernet.typename = "EthernetLayer"
*.talker.ethernet.typename = "EthernetLayer"
*.listener.ieee8021q.typename = "Ieee8021qProtocol"
*.talker.ieee8021q.typename = "Ieee8021qProtocol"
*.listener.ethernet.hasSocketSupport = true
*.talker.ethernet.hasSocketSupport = true
*.listener.llc.typename = ""
*.talker.llc.typename = ""
**.eth[*].bitrate = 1Gbps
*.upf.dnEth.bitrate = 1Gbps

# The UE: Ethernet PDU session, no IP layer
*.ue[*].sessionType = "Ethernet"
*.ue[*].hasIpv4 = false


#------------------------------------#
# Config S1
#
# Stage S1: nascTime's copy of Simu5G 1.8.0's Ethernet-Bridge configuration. ue[0] is
# an Ethernet bridge for talker. talker and listener exchange VLAN 42 frames of two
# priorities, PCP 5 and PCP 0. QoS rules put PCP 5 on QoS flow 5 (DRB 2) and the rest
# on the default QoS flow (DRB 1), in both directions. Values are identical to the
# upstream config; only the station names differ (device[0] -> talker,
# dnStation -> listener).
#
[Config S1]
description = "S1: nascTime copy of Simu5G Ethernet-Bridge (talker - UE bridge - gNB - UPF bridge - listener)"
*.ue[0].ethernetMode = "bridge"
*.ue[0].numEthInterfaces = 1
*.bearerConfigurator.staticDrbs = [
    {coreNetwork: "5gc", ue: "ue[0]", drbId: 1, isDefault: true, lcg: 3, rlcMode: "UM"},
    {coreNetwork: "5gc", ue: "ue[0]", drbId: 2, mappedQfis: [5], lcg: 1, rlcMode: "UM"}
    ]
*.bearerConfigurator.ulQfiRules = [{ue: "ue[0]", filter: "expr(has(ieee8021qctag) && ieee8021qctag.pcp == 5)", qfi: 5}]
*.bearerConfigurator.dlQfiRules = [{filter: "expr(has(ieee8021qctag) && ieee8021qctag.pcp == 5)", qfi: 5}]
*.talker.numApps = 3
*.listener.numApps = 3
**.app[0..1].typename = "EthernetSourceApp"
**.app[0..1].source.packetLength = 100B
**.app[0..1].source.productionInterval = 20ms
**.app[0..1].source.initialProductionOffset = 0.1s + 5ms * ancestorIndex(1)
**.app[0..1].io.interface = "eth0"
**.app[0..1].tagger.typename = "PacketTagger"
**.app[0..1].tagger.vlanId = 42
**.app[0..1].tagger.encapsulationProtocols = ["ieee8021qctag"]
**.app[0].tagger.pcp = 5
**.app[1].tagger.pcp = 0
*.talker.app[0..1].io.remoteAddress = "listener"
*.listener.app[0..1].io.remoteAddress = "talker"
**.app[2].typename = "EthernetSinkApp"
**.app[2].io.interface = "eth0"
**.app[2].io.steal = true
*.talker.app[2].io.localAddress = "talker"
*.listener.app[2].io.localAddress = "listener"


#------------------------------------#
# Config S2
#
# Stage S2: Config S1 with two pass-through translators inserted (network parameter
# hasPassThroughTts): dsTt between ue[0] and talker, nwTt between the UPF's N6 Ethernet
# port and listener. Each is nasctime.tt.PassThroughTt, an INET TsnSwitch with every
# TSN feature off. Nothing else changes.
#
[Config S2]
description = "S2: S1 + pass-through DS-TT and NW-TT (two-port 802.1Q bridges, TSN features off)"
extends = S1
*.hasPassThroughTts = true

#------------------------------------#
# Config S2-pcap
#
# Config S2 with PCAP recording on both ports of both translators (one file per port),
# for the protocol check: frames must leave a translator byte-identical to how they
# entered it. Recording only observes signals; it does not change the simulation.
#
[Config S2-pcap]
description = "S2 with PCAP on each translator port"
extends = S2
*.*Tt.numPcapRecorders = 2
*.*Tt.pcapRecorder[0].moduleNamePatterns = "eth[0]"
*.*Tt.pcapRecorder[1].moduleNamePatterns = "eth[1]"
*.*Tt.pcapRecorder[*].fileFormat = "pcap"
*.*Tt.pcapRecorder[*].timePrecision = 9
*.*Tt.pcapRecorder[*].pcapFile = "${resultdir}/pcap/" + fullPath() + ".pcap"
*.*Tt.pcapRecorder[*].verbose = false
# PCAP needs real FCS bytes; S2 keeps the default (declared) FCS. check_s2 verifies
# that this setting does not change any delay sample relative to Config S2.
**.fcsMode = "computed"


#------------------------------------#
# Config S3
#
# Stage S3: VLAN/PCP -> QFI -> DRB mapping on the S2 network (translators on, still
# pass-through). Each station sends nine flows to the other: VLAN 42 with PCP 0..7
# (app[0..7]) and one untagged flow (app[8]); app[9] is the sink. Every flow has its
# own frame length, so a frame's flow can be told from its length anywhere in the
# 5G system (payload 100 B + 20 B x PCP; untagged 300 B). Flows start 2 ms apart,
# one frame per 20 ms each.
# Rules, identical in both directions: PCP 5 -> QFI 5 -> DRB 2, PCP 6 -> QFI 6 -> DRB 3;
# everything else (PCP 0-4, 7, untagged) -> default QoS flow (QFI 0) -> default DRB 1.
#
[Config S3]
description = "S3: S2 + flow matrix PCP 0-7 and untagged; PCP 5 -> QFI 5 -> DRB 2, PCP 6 -> QFI 6 -> DRB 3, rest -> default"
extends = S2
*.bearerConfigurator.staticDrbs = [
    {coreNetwork: "5gc", ue: "ue[0]", drbId: 1, isDefault: true, lcg: 3, rlcMode: "UM"},
    {coreNetwork: "5gc", ue: "ue[0]", drbId: 2, mappedQfis: [5], lcg: 1, rlcMode: "UM"},
    {coreNetwork: "5gc", ue: "ue[0]", drbId: 3, mappedQfis: [6], lcg: 2, rlcMode: "UM"}
    ]
*.bearerConfigurator.ulQfiRules = [
    {ue: "ue[0]", filter: "expr(has(ieee8021qctag) && ieee8021qctag.pcp == 5)", qfi: 5},
    {ue: "ue[0]", filter: "expr(has(ieee8021qctag) && ieee8021qctag.pcp == 6)", qfi: 6}
    ]
*.bearerConfigurator.dlQfiRules = [
    {filter: "expr(has(ieee8021qctag) && ieee8021qctag.pcp == 5)", qfi: 5},
    {filter: "expr(has(ieee8021qctag) && ieee8021qctag.pcp == 6)", qfi: 6}
    ]
*.talker.numApps = 10
*.listener.numApps = 10
**.app[0..8].typename = "EthernetSourceApp"
**.app[0..8].source.packetLength = (ancestorIndex(1) < 8 ? 100B + 20B * ancestorIndex(1) : 300B)
**.app[0..8].source.productionInterval = 20ms
**.app[0..8].source.initialProductionOffset = 0.1s + 2ms * ancestorIndex(1)
**.app[0..8].io.interface = "eth0"
**.app[0..8].io.localAddress = ""
**.app[0..8].io.steal = false
**.app[0..7].tagger.typename = "PacketTagger"
**.app[0..7].tagger.vlanId = 42
**.app[0..7].tagger.pcp = ancestorIndex(1)
**.app[0..7].tagger.encapsulationProtocols = ["ieee8021qctag"]
**.app[8].tagger.typename = ""
*.talker.app[0..8].io.remoteAddress = "listener"
*.listener.app[0..8].io.remoteAddress = "talker"
**.app[9].typename = "EthernetSinkApp"
**.app[9].io.interface = "eth0"
**.app[9].io.steal = true
*.talker.app[9].io.localAddress = "talker"
*.listener.app[9].io.localAddress = "listener"
# Evidence of the DRB each frame actually used: RLC entities are per DRB
# (module name ...-um-<node>-<drbId>); record their SDU sizes on the TX side too
# (the RX side records them by default). Recording only.
**.cellularNic.*.tx.receivedPacketFromUpperLayer.result-recording-modes = +vector(packetBytes)

#------------------------------------#
# Config S3-pcap
#
# Config S3 with PCAP on N3 (the UPF's PPP interface to the gNB: GTP-U with the QFI in
# the PDU Session Container) and on the 5G-system side port of each translator.
# PCAP needs real FCS and checksums; check_s3 verifies that these settings change no
# delay sample relative to Config S3 (seed 0).
#
[Config S3-pcap]
description = "S3 with PCAP on N3 and on the translators' 5G-side ports"
extends = S3
*.upf.numPcapRecorders = 1
*.upf.pcapRecorder[0].moduleNamePatterns = "ppp[0]"
*.*Tt.numPcapRecorders = 1
*.*Tt.pcapRecorder[0].moduleNamePatterns = "eth[0]"
**.pcapRecorder[*].fileFormat = "pcap"
**.pcapRecorder[*].timePrecision = 9
**.pcapRecorder[*].pcapFile = "${resultdir}/pcap/" + fullPath() + ".pcap"
**.pcapRecorder[*].verbose = false
**.fcsMode = "computed"
**.checksumMode = "computed"

#------------------------------------#
# Negative controls (seed 0, with PCAP). Each changes one thing in S3; check_s3
# states which checks must then fail -- exactly those and no others.
#
# Absent traffic: a rule for VLAN 43, which no frame carries, put first in both rule
# lists. Nothing may change: same QFIs, same DRBs, bit-identical delay samples.
[Config S3-neg-absent]
description = "S3 negative control: extra rules for absent VLAN 43 traffic (expect no change)"
extends = S3-pcap
*.bearerConfigurator.ulQfiRules = [
    {ue: "ue[0]", filter: "expr(has(ieee8021qctag) && ieee8021qctag.vid == 43)", qfi: 5},
    {ue: "ue[0]", filter: "expr(has(ieee8021qctag) && ieee8021qctag.pcp == 5)", qfi: 5},
    {ue: "ue[0]", filter: "expr(has(ieee8021qctag) && ieee8021qctag.pcp == 6)", qfi: 6}
    ]
*.bearerConfigurator.dlQfiRules = [
    {filter: "expr(has(ieee8021qctag) && ieee8021qctag.vid == 43)", qfi: 5},
    {filter: "expr(has(ieee8021qctag) && ieee8021qctag.pcp == 5)", qfi: 5},
    {filter: "expr(has(ieee8021qctag) && ieee8021qctag.pcp == 6)", qfi: 6}
    ]

# Uplink classification swapped (PCP 5 -> QFI 6, PCP 6 -> QFI 5); downlink and the
# QFI -> DRB mapping unchanged. Expect: UL QFI and UL DRB checks fail, DL ones pass.
[Config S3-mut-ul-swap]
description = "S3 mutation: UL rules swapped (expect UL QFI and UL DRB checks to fail)"
extends = S3-pcap
*.bearerConfigurator.ulQfiRules = [
    {ue: "ue[0]", filter: "expr(has(ieee8021qctag) && ieee8021qctag.pcp == 5)", qfi: 6},
    {ue: "ue[0]", filter: "expr(has(ieee8021qctag) && ieee8021qctag.pcp == 6)", qfi: 5}
    ]

# Downlink classification swapped. Expect: DL QFI and DL DRB checks fail, UL ones pass.
[Config S3-mut-dl-swap]
description = "S3 mutation: DL rules swapped (expect DL QFI and DL DRB checks to fail)"
extends = S3-pcap
*.bearerConfigurator.dlQfiRules = [
    {filter: "expr(has(ieee8021qctag) && ieee8021qctag.pcp == 5)", qfi: 6},
    {filter: "expr(has(ieee8021qctag) && ieee8021qctag.pcp == 6)", qfi: 5}
    ]

# QFI -> DRB mapping swapped (DRB 2 carries QFI 6, DRB 3 QFI 5); classification
# unchanged. Expect: all four DRB checks fail, both QFI checks pass -- the QFI and DRB
# checks observe different things.
[Config S3-mut-drb-swap]
description = "S3 mutation: QFI->DRB mapping swapped (expect DRB checks to fail, QFI checks to pass)"
extends = S3-pcap
*.bearerConfigurator.staticDrbs = [
    {coreNetwork: "5gc", ue: "ue[0]", drbId: 1, isDefault: true, lcg: 3, rlcMode: "UM"},
    {coreNetwork: "5gc", ue: "ue[0]", drbId: 2, mappedQfis: [6], lcg: 1, rlcMode: "UM"},
    {coreNetwork: "5gc", ue: "ue[0]", drbId: 3, mappedQfis: [5], lcg: 2, rlcMode: "UM"}
    ]

#------------------------------------#
# Config S3-load (experimental, recorded without a claim)
#
# Config S3 plus a saturating background flow on the default DRB in each direction:
# app[10], VLAN 42 PCP 0, 1400 B payload every 0.25 ms (44.8 Mb/s of payload). The
# mapping checks are repeated under load; delays and delivery per flow are recorded.
#
[Config S3-load]
description = "S3 + saturating PCP 0 background flow on the default DRB (experimental)"
extends = S3
*.talker.numApps = 11
*.listener.numApps = 11
**.app[10].typename = "EthernetSourceApp"
**.app[10].source.packetLength = 1400B
**.app[10].source.productionInterval = 0.25ms
**.app[10].source.initialProductionOffset = 0.1s + 500us
**.app[10].io.interface = "eth0"
**.app[10].tagger.typename = "PacketTagger"
**.app[10].tagger.vlanId = 42
**.app[10].tagger.pcp = 0
**.app[10].tagger.encapsulationProtocols = ["ieee8021qctag"]
*.talker.app[10].io.remoteAddress = "listener"
*.listener.app[10].io.remoteAddress = "talker"

#------------------------------------#
# Investigation O-S3-1 (frame non-delivery under saturating load). These configs only
# observe; Config S3-load and its checks are unchanged.
#
# O1-drain: Config S3-load, but every source stops producing at 3 s and the run
# continues to 5 s, so nothing can be "in flight at the end": any frame not delivered
# by then was lost, not delayed.
[Config O1-drain]
description = "O-S3-1: S3-load with sources stopping at 3 s, run to 5 s (drain)"
extends = S3-load
sim-time-limit = 5s
**.app[0..8].source.productionInterval = simTime() < 3s ? 20ms : 1000s
**.app[10].source.productionInterval = simTime() < 3s ? 0.25ms : 1000s

# O1-harq16: counterfactual -- the same, with 16 instead of 5 HARQ processes at the
# gNB and the UE (NR allows up to 16). Investigation only; not adopted.
[Config O1-harq16]
description = "O-S3-1 counterfactual: O1-drain with 16 HARQ processes"
extends = O1-drain
*.gnb1.cellularNic.mac.harqProcesses = 16
*.ue[0].cellularNic.nrMac.harqProcesses = 16

# Event traces (seed 0): Simu5G's own debug log of the gNB and UE MAC, which is the
# only place where some MAC events are reported. The runner keeps a filtered copy.
[Config O1-drain-trace]
description = "O1-drain with the MAC debug log"
extends = O1-drain
cmdenv-express-mode = false
cmdenv-log-prefix = "%t %N %c| "
*.gnb1.cellularNic.mac.cmdenv-log-level = debug
*.ue[0].cellularNic.nrMac.cmdenv-log-level = debug
**.cmdenv-log-level = off

[Config O1-harq16-trace]
description = "O1-harq16 with the MAC debug log"
extends = O1-harq16
cmdenv-express-mode = false
cmdenv-log-prefix = "%t %N %c| "
*.gnb1.cellularNic.mac.cmdenv-log-level = debug
*.ue[0].cellularNic.nrMac.cmdenv-log-level = debug
**.cmdenv-log-level = off


#------------------------------------#
# Config S4
#
# Stage S4: gPTP transport through the S2 network (pass-through translators, 5G system
# not time-aware). listener, behind nwTt, becomes the gPTP grandmaster and talker,
# behind dsTt, the gPTP slave: both are INET TsnDevices (StandardHost + gPTP + clock).
# gPTP defaults: two-step Sync every 125 ms, Pdelay every 1 s. Both clocks are ideal
# (no oscillator drift), so any slave clock error comes from the path alone. The S2
# talker/listener traffic keeps running.
#
[Config S4]
description = "S4: S2 + gPTP grandmaster (listener, behind nwTt) and slave (talker, behind dsTt); 5G system not time-aware"
extends = S2
*.talker.typename = "TsnDevice"
*.listener.typename = "TsnDevice"
*.talker.hasTimeSynchronization = true
*.listener.hasTimeSynchronization = true
*.listener.gptp.gptpNodeType = "MASTER_NODE"
*.listener.gptp.slavePort = ""
*.listener.gptp.masterPorts = ["eth0"]
*.talker.gptp.gptpNodeType = "SLAVE_NODE"
*.talker.gptp.slavePort = "eth0"
*.talker.clock.oscillator.typename = "IdealOscillator"
*.listener.clock.oscillator.typename = "IdealOscillator"
# INET's gPTP timestamps at the start of transmission/reception, which INET's default
# store-and-forward PHY (PacketReceiver) does not signal: use INET's streaming PHY
# transmitter/receiver on both ends of the two station links (as INET's gPTP showcase does)
*.talker.eth[*].phyLayer.transmitter.typename = "StreamingTransmitter"
*.talker.eth[*].phyLayer.receiver.typename = "DestreamingReceiver"
*.listener.eth[*].phyLayer.transmitter.typename = "StreamingTransmitter"
*.listener.eth[*].phyLayer.receiver.typename = "DestreamingReceiver"
*.dsTt.eth[1].phyLayer.transmitter.typename = "StreamingTransmitter"
*.dsTt.eth[1].phyLayer.receiver.typename = "DestreamingReceiver"
*.nwTt.eth[1].phyLayer.transmitter.typename = "StreamingTransmitter"
*.nwTt.eth[1].phyLayer.receiver.typename = "DestreamingReceiver"
# record the slave clock every 1 ms (recording only)
*.talker.clock.emitClockTimeInterval = 1ms
*.talker.clock.referenceClock = "listener.clock"

#------------------------------------#
# Config S4-pcap
#
# Config S4 with PCAP on both gPTP stations, on the translators' 5G-side ports and on
# N3, for the transport and clock checks (seed 0). PCAP needs real FCS and checksums;
# check_s4 verifies that these settings change no gPTP or clock sample relative to S4.
#
[Config S4-pcap]
description = "S4 with PCAP on the gPTP stations, the translators' 5G-side ports and N3"
extends = S4
*.talker.numPcapRecorders = 1
*.listener.numPcapRecorders = 1
*.*Tt.numPcapRecorders = 1
*.*Tt.pcapRecorder[0].moduleNamePatterns = "eth[0]"
*.talker.pcapRecorder[0].moduleNamePatterns = "eth[0]"
*.listener.pcapRecorder[0].moduleNamePatterns = "eth[0]"
*.upf.numPcapRecorders = 1
*.upf.pcapRecorder[0].moduleNamePatterns = "ppp[0]"
**.pcapRecorder[*].fileFormat = "pcap"
**.pcapRecorder[*].timePrecision = 9
**.pcapRecorder[*].pcapFile = "${resultdir}/pcap/" + fullPath() + ".pcap"
**.pcapRecorder[*].verbose = false
**.fcsMode = "computed"
**.checksumMode = "computed"

#------------------------------------#
# Investigation O-S4-1 / O-S3-2 (late and stranded DL SDU tails). Observation only;
# Configs S3, S4 and their checks are unchanged.
#
# O2-s4: Config S4 plus TX-side RLC SDU-size vectors (recording only), so that the
# gNB's DRB 1 RLC can be replayed byte by byte: SDUs in, PDU sizes out, SDUs delivered.
[Config O2-s4]
description = "O-S4-1: S4 with TX-side RLC SDU vectors"
extends = S4
**.cellularNic.*.tx.receivedPacketFromUpperLayer.result-recording-modes = +vector(packetBytes)

# O2-s4-nodl: the same without the listener's PCP 0 flow (app[1]), so that DRB 1 in DL
# carries gPTP only (Sync + Follow_Up queued together).
[Config O2-s4-nodl]
description = "O-S4-1 counterfactual: O2-s4 without the DL PCP 0 application flow"
extends = O2-s4
*.listener.app[1].source.initialProductionOffset = 1000s

# O2-flush: O-S3-2 counterfactual -- O1-harq16 plus a single 50 B PCP 0 frame from
# listener to talker at 3.5 s, after all other traffic has stopped.
[Config O2-flush]
description = "O-S3-2 counterfactual: O1-harq16 plus one DL frame at 3.5 s"
extends = O1-harq16
*.listener.numApps = 12
*.listener.app[11].typename = "EthernetSourceApp"
*.listener.app[11].source.packetLength = 50B
*.listener.app[11].source.productionInterval = 1000s
*.listener.app[11].source.initialProductionOffset = 3.5s
*.listener.app[11].io.interface = "eth0"
*.listener.app[11].io.remoteAddress = "talker"
*.listener.app[11].tagger.typename = "PacketTagger"
*.listener.app[11].tagger.vlanId = 42
*.listener.app[11].tagger.pcp = 0
*.listener.app[11].tagger.encapsulationProtocols = ["ieee8021qctag"]


#------------------------------------#
# Config S5
#
# Stage S5: timing metadata across the Ethernet - 5G - Ethernet bridge, on the S4
# network (gPTP + S2 traffic). Three kinds of metadata are separated:
#  - in the packet (on the wire): the application frames now carry INET's
#    ApplicationPacket payload (length + 32-bit sequence number), and gPTP its own
#    timestamps and correctionField;
#  - carried with the packet inside the simulation, not on the wire: INET region tags,
#    i.e. the application's creation time, and an elapsed-time flow tag that INET's
#    MeasurementLayer starts on each translator's 5G-side port for every frame sent into
#    the 5G system and records on the other translator's 5G-side port;
#  - observation only: PCAP (Config S5-pcap).
# TX-side RLC SDU vectors are recorded so that cut-and-reassembled SDUs can be named.
#
[Config S5]
description = "S5: S4 + sequence-numbered application payload + 5G-transit measurement tags at the translators"
extends = S4
**.app[0..1].source.packetRepresentation = "applicationPacket"
*.*Tt.eth[0].measurementLayer.typename = "MeasurementLayer"
*.*Tt.eth[0].measurementLayer.measurementStarter.flowName = "transit5gs"
*.*Tt.eth[0].measurementLayer.measurementStarter.measure = "elapsedTime"
*.*Tt.eth[0].measurementLayer.measurementRecorder.flowName = "transit5gs"
*.*Tt.eth[0].measurementLayer.measurementRecorder.measure = "elapsedTime"
**.cellularNic.*.tx.receivedPacketFromUpperLayer.result-recording-modes = +vector(packetBytes)

# Controls: S5 without the measurement layers, and S5 with PCAP.
[Config S5-nomeas]
description = "S5 control: no measurement layers"
extends = S5
*.*Tt.eth[0].measurementLayer.typename = ""

[Config S5-pcap]
description = "S5 with PCAP on the stations and on the translators' 5G-side ports"
extends = S5
*.talker.numPcapRecorders = 1
*.listener.numPcapRecorders = 1
*.*Tt.numPcapRecorders = 1
*.*Tt.pcapRecorder[0].moduleNamePatterns = "eth[0]"
*.talker.pcapRecorder[0].moduleNamePatterns = "eth[0]"
*.listener.pcapRecorder[0].moduleNamePatterns = "eth[0]"
**.pcapRecorder[*].fileFormat = "pcap"
**.pcapRecorder[*].timePrecision = 9
**.pcapRecorder[*].pcapFile = "${resultdir}/pcap/" + fullPath() + ".pcap"
**.pcapRecorder[*].verbose = false
**.fcsMode = "computed"
**.checksumMode = "computed"
